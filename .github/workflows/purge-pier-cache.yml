name: Purge Pier Cache

on:
  push:
    paths:
      - '.github/workflows/purge-pier-cache.yml'

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate Cloudflare token is available
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not available in this repository"
            exit 2
          fi
      - name: Resolve f45pompano.com zone
        id: zone
        run: |
          set -euo pipefail
          RESP=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "https://api.cloudflare.com/client/v4/zones?name=f45pompano.com")
          ZONE_ID=$(python -c 'import json,sys; d=json.load(sys.stdin); print((d.get("result") or [{}])[0].get("id", ""))' <<< "$RESP")
          if [ -z "$ZONE_ID" ]; then
            echo "Unable to resolve Cloudflare zone for f45pompano.com"
            echo "$RESP"
            exit 3
          fi
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"
      - name: Purge Pier URLs from Cloudflare cache
        run: |
          set -euo pipefail
          ZONE_ID='${{ steps.zone.outputs.zone_id }}'
          BODY='{"files":["https://f45pompano.com/pier/","https://f45pompano.com/pier/index.html","https://www.f45pompano.com/pier/","https://www.f45pompano.com/pier/index.html"]}'
          RESP=$(curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$BODY")
          python - <<'PY' <<< "$RESP"
import json,sys
x=json.load(sys.stdin)
print(json.dumps(x, indent=2))
if not x.get('success'):
    raise SystemExit(4)
PY
