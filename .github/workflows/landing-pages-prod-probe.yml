name: Landing Pages Validation and Production Probe

on:
  pull_request:
    paths:
      - 'build.js'
      - 'data/**'
      - 'public/landing/**'
      - 'public/landing-admin/**'
      - 'public/landing-runtime.js'
      - 'functions/api/landing/**'
      - 'functions/landing/**'
      - '.github/workflows/landing-pages-prod-probe.yml'
  push:
    branches: [main]
    paths:
      - 'build.js'
      - 'data/**'
      - 'public/landing/**'
      - 'public/landing-admin/**'
      - 'public/landing-runtime.js'
      - 'functions/api/landing/**'
      - 'functions/landing/**'
      - '.github/workflows/landing-pages-prod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build site
        run: npm run build
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check public/landing/admin/app.js
          node --check public/landing-runtime.js
          node --input-type=module --check < functions/api/landing/_shared.js
          node --input-type=module --check < functions/api/landing/admin/pages.js
          node --input-type=module --check < 'functions/landing/[slug].js'
      - name: Verify generated landing assets
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/sarpinos.html
          test -f dist/stretch-zone.html
          test -f dist/100-chiropractic.html
          test -f dist/pier/index.html
          test -f dist/tableleads/index.html
          grep -q '/landing-runtime.js?v=5' dist/sarpinos.html
          grep -q 'id="pageKind"' dist/landing/admin/index.html
          grep -q 'id="leadEventSlug"' dist/landing/admin/index.html

  production_probe:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and verify landing system
        shell: bash
        run: |
          set -euo pipefail
          base='https://f45pompano.com'
          ok=0
          for i in $(seq 1 30); do
            admin="$(curl -fsSL --max-time 20 "$base/landing/admin/?probe=$GITHUB_SHA" || true)"
            runtime="$(curl -fsSL --max-time 20 "$base/landing-runtime.js?v=5&probe=$GITHUB_SHA" || true)"
            pier="$(curl -fsSL --max-time 20 "$base/pier/?probe=$GITHUB_SHA" || true)"
            sarpinos="$(curl -fsSL --max-time 20 "$base/sarpinos/?probe=$GITHUB_SHA" || true)"
            stretch="$(curl -fsSL --max-time 20 "$base/stretch-zone/?probe=$GITHUB_SHA" || true)"
            chiropractic="$(curl -fsSL --max-time 20 "$base/100-chiropractic/?probe=$GITHUB_SHA" || true)"
            tableleads="$(curl -fsSL --max-time 20 "$base/tableleads/?probe=$GITHUB_SHA" || true)"
            config="$(curl -fsSL --max-time 20 "$base/api/landing/config?slug=root&probe=$GITHUB_SHA" || true)"
            if grep -q 'id="pageKind"' <<<"$admin" && \
               grep -q 'id="leadEventSlug"' <<<"$admin" && \
               grep -q 'landingArchivedTitle' <<<"$runtime" && \
               grep -q 'Spin to Win' <<<"$pier" && \
               grep -qi "Sarpino" <<<"$sarpinos" && \
               grep -qi "Stretch Zone" <<<"$stretch" && \
               grep -qi "Chiropractic" <<<"$chiropractic" && \
               grep -q 'id="leadForm"' <<<"$tableleads" && \
               grep -q '"ok":true' <<<"$config"; then
              ok=1
              echo "Production landing assets converged on attempt $i."
              break
            fi
            echo "Attempt $i: production has not converged yet."
            sleep 10
          done
          test "$ok" -eq 1

          status="$(curl -sS -o /tmp/landing-admin.txt -w '%{http_code}' --max-time 20 "$base/api/landing/admin/pages")"
          test "$status" = '401'
          grep -q 'unauthorized' /tmp/landing-admin.txt
          echo "Production landing pages, preserved legacy URLs, Table Leads form, and protected admin API verified."
