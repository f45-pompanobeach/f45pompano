name: Probe Live Pier

on:
  push:
    paths:
      - '.github/workflows/probe-pier-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live host deployment
        run: sleep 60

      - name: Verify live dashboard and EVENT_DB
        shell: bash
        run: |
          set -euo pipefail

          echo '===== ENTRY PAGE ====='
          PAGE=$(mktemp)
          PCODE=$(curl -L --max-time 30 -sS -o "$PAGE" -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' 'https://f45pompano.com/pier/?probe=staff-controls-final')
          echo "PAGE_HTTP: $PCODE"
          test "$PCODE" = '200'
          test "$(grep -Foc 'related to my entry, including entry confirmation, prize notifications, and prize redemption or setup follow-up' "$PAGE" || true)" -eq 1
          test "$(grep -Foc 'expires in 20 minutes' "$PAGE" || true)" -eq 1

          echo '===== STAFF DASHBOARD ====='
          STAFF=$(mktemp)
          SCODE=$(curl -L --max-time 30 -sS -o "$STAFF" -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' 'https://f45pompano.com/pier/staff/?probe=staff-controls-final')
          echo "STAFF_HTTP: $SCODE"
          test "$SCODE" = '200'
          grep -Fq 'F45 Event Lead Dashboard' "$STAFF"
          grep -Fq 'You + Friend — 3 Free Classes Each' "$STAFF"
          grep -Fq 'None / Reset' "$STAFF"
          grep -Fq 'Delete Lead' "$STAFF"
          grep -Fq '/api/pier/staff/delete' "$STAFF"
          ! grep -Fq 'Double Grand-Prize Entry' "$STAFF"
          ! grep -Fq 'Grand-Prize Entry — 1 Month Unlimited' "$STAFF"

          echo '===== API HEALTH / DATABASE ====='
          HEALTH=$(mktemp)
          HCODE=$(curl -L --max-time 30 -sS -o "$HEALTH" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/api/pier/health?probe=staff-controls-final')
          echo "HEALTH_HTTP: $HCODE"
          echo "HEALTH_BODY: $(cat "$HEALTH")"
          test "$HCODE" = '200'
          grep -q '"service":"event-lead-verification"' "$HEALTH"
          grep -q '"telnyx_configured":true' "$HEALTH"
          grep -q '"d1_configured":true' "$HEALTH"
          grep -q '"d1_ok":true' "$HEALTH"
          grep -q '"schema_ready":true' "$HEALTH"
          grep -q '"database_binding":"EVENT_DB"' "$HEALTH"
          grep -q '"database_error":null' "$HEALTH"
          grep -q '"staff_dashboard":true' "$HEALTH"
          grep -q '"assignment_status":"ASSIGNED"' "$HEALTH"

          echo '===== STAFF AUTH ====='
          AUTH_BODY=$(mktemp)
          ACODE=$(curl -L --max-time 30 -sS -o "$AUTH_BODY" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/api/pier/staff/leads')
          echo "UNAUTH_STAFF_HTTP: $ACODE"
          test "$ACODE" = '401'
          grep -q '"unauthorized"' "$AUTH_BODY"

          echo '===== CONFIRMATION ROUTE ====='
          CONF=$(mktemp)
          CCODE=$(curl -L --max-time 30 -sS -o "$CONF" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/pier/v/not-a-valid-token')
          echo "CONFIRM_HTTP: $CCODE"
          test "$CCODE" = '400'
          test "$(grep -Foc 'Return to the F45 entry form and submit again.' "$CONF" || true)" -eq 1

          rm -f "$PAGE" "$STAFF" "$HEALTH" "$AUTH_BODY" "$CONF"
