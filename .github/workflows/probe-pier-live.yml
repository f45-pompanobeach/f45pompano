name: Probe Live Pier

on:
  push:
    paths:
      - '.github/workflows/probe-pier-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live host deployment
        run: sleep 45
      - name: Inspect recent Pier SMS delivery records
        shell: bash
        run: |
          set -euo pipefail
          echo '===== API HEALTH ====='
          HEALTH=$(mktemp)
          CODE=$(curl -L --max-time 30 -sS -o "$HEALTH" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/api/pier/health?probe=diag-c7c7e764')
          echo "HEALTH_HTTP: $CODE"
          echo "HEALTH_BODY: $(cat "$HEALTH")"
          test "$CODE" = "200"
          grep -q '"assignment_status":"ASSIGNED"' "$HEALTH"

          echo '===== RECENT SMS DETAIL RECORDS ====='
          DIAG=$(mktemp)
          DCODE=$(curl -L --max-time 30 -sS -o "$DIAG" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/api/pier/diag?probe=c7c7e764')
          echo "DIAG_HTTP: $DCODE"
          echo "DIAG_BODY: $(cat "$DIAG")"
          test "$DCODE" = "200"
          grep -q '"ok":true' "$DIAG"
          rm -f "$HEALTH" "$DIAG"
