name: Probe Live Pier

on:
  push:
    paths:
      - '.github/workflows/probe-pier-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare custom domain and Pages production
        shell: bash
        run: |
          set -euo pipefail
          for URL in \
            'https://f45pompano.com/pier/staff/?probe=cache-diagnostic-3' \
            'https://f45pompano.pages.dev/pier/staff/?probe=cache-diagnostic-3' \
            'https://main.f45pompano-test.pages.dev/pier/staff/?probe=cache-diagnostic-3'; do
            echo "===== $URL ====="
            BODY=$(mktemp); HDR=$(mktemp)
            CODE=$(curl -L --max-time 30 -sS -D "$HDR" -o "$BODY" -w '%{http_code}' -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$URL")
            echo "HTTP=$CODE"
            grep -Ei '^(server|cf-cache-status|age|cache-control|etag|last-modified):' "$HDR" || true
            echo "DASHBOARD=$(grep -Foc 'F45 Event Lead Dashboard' "$BODY" || true)"
            echo "NEW_FRIEND=$(grep -Foc 'You + Friend — 3 Free Classes Each' "$BODY" || true)"
            echo "NONE_RESET=$(grep -Foc 'None / Reset' "$BODY" || true)"
            echo "DELETE_LEAD=$(grep -Foc 'Delete Lead' "$BODY" || true)"
            echo "DOUBLE_GRAND=$(grep -Foc 'Double Grand-Prize Entry' "$BODY" || true)"
            echo "GRAND_PRIZE=$(grep -Foc 'Grand-Prize Entry — 1 Month Unlimited' "$BODY" || true)"
            rm -f "$BODY" "$HDR"
          done
