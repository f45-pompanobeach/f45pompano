name: Probe Live Pier

on:
  push:
    paths:
      - '.github/workflows/probe-pier-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live host deployment
        run: sleep 45
      - name: Verify public Pier page and delivery-status backend
        shell: bash
        run: |
          set -euo pipefail
          PAGE=$(mktemp)
          curl -L --max-time 30 -sS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' 'https://f45pompano.com/pier/?probe=delivery-4c2e1404' -o "$PAGE"
          echo "TITLE: $(grep -io '<title>[^<]*' "$PAGE" | head -1 | sed 's/<title>//I')"
          echo "SPIN_COUNT: $(grep -io 'Spin to Win' "$PAGE" | wc -l | tr -d ' ')"

          echo '===== API HEALTH ====='
          HEALTH=$(mktemp)
          CODE=$(curl -L --max-time 30 -sS -o "$HEALTH" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/api/pier/health?probe=delivery-4c2e1404')
          echo "HEALTH_HTTP: $CODE"
          echo "HEALTH_BODY: $(cat "$HEALTH")"
          test "$CODE" = "200"
          grep -q '"telnyx_configured":true' "$HEALTH"

          echo '===== REGISTER VALIDATION ====='
          REG=$(mktemp)
          RCODE=$(curl -L --max-time 30 -sS -o "$REG" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' 'https://f45pompano.com/api/pier/register')
          echo "REGISTER_HTTP: $RCODE"
          echo "REGISTER_BODY: $(cat "$REG")"
          test "$RCODE" = "400"
          grep -q 'Please enter your first and last name.' "$REG"
          rm -f "$PAGE" "$HEALTH" "$REG"
