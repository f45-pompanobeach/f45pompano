name: Probe Live Pier

on:
  push:
    paths:
      - '.github/workflows/probe-pier-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live host deployment
        run: sleep 45
      - name: Verify public Pier page and API health
        shell: bash
        run: |
          set -euo pipefail
          PAGE=$(mktemp)
          curl -L --max-time 30 -sS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' 'https://f45pompano.com/pier/?probe=final-5a0b9421' -o "$PAGE"
          echo "TITLE: $(grep -io '<title>[^<]*' "$PAGE" | head -1 | sed 's/<title>//I')"
          echo "SPIN_COUNT: $(grep -io 'Spin to Win' "$PAGE" | wc -l | tr -d ' ')"
          echo "NO_PHONE_HELP_COUNT: $(grep -Foc 'No phone with you?' "$PAGE" || true)"
          test "$(grep -io 'Spin to Win' "$PAGE" | wc -l | tr -d ' ')" -gt 0
          test "$(grep -Foc 'No phone with you?' "$PAGE" || true)" -eq 0

          echo '===== API HEALTH ====='
          HEALTH=$(mktemp)
          CODE=$(curl -L --max-time 30 -sS -o "$HEALTH" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/api/pier/health?probe=final-5a0b9421')
          echo "HEALTH_HTTP: $CODE"
          echo "HEALTH_BODY: $(cat "$HEALTH")"

          echo '===== REGISTER ROUTE ====='
          REG=$(mktemp)
          RCODE=$(curl -L --max-time 30 -sS -o "$REG" -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{}' 'https://f45pompano.com/api/pier/register')
          echo "REGISTER_HTTP: $RCODE"
          echo "REGISTER_BODY: $(cat "$REG")"
          rm -f "$PAGE" "$HEALTH" "$REG"
