name: Probe Live Pier

on:
  push:
    paths:
      - '.github/workflows/probe-pier-live.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for live host deployment
        run: sleep 45
      - name: Verify public Pier page and API health
        shell: bash
        run: |
          set -euo pipefail
          PAGE=$(mktemp)
          curl -L --max-time 30 -sS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' 'https://f45pompano.com/pier/?probe=10dlc-88f71f4f' -o "$PAGE"
          echo "TITLE: $(grep -io '<title>[^<]*' "$PAGE" | head -1 | sed 's/<title>//I')"
          echo "SPIN_COUNT: $(grep -io 'Spin to Win' "$PAGE" | wc -l | tr -d ' ')"
          echo "RECURRING_CTA_COUNT: $(grep -Foc 'I agree to receive recurring customer care and marketing text messages from F45 Training Pompano Beach' "$PAGE" || true)"
          echo "STOP_COUNT: $(grep -Foc 'Reply STOP to opt out or HELP for help.' "$PAGE" || true)"
          echo "RATES_COUNT: $(grep -Foc 'Message and data rates may apply.' "$PAGE" || true)"
          test "$(grep -Foc 'I agree to receive recurring customer care and marketing text messages from F45 Training Pompano Beach' "$PAGE" || true)" -eq 1
          test "$(grep -Foc 'Reply STOP to opt out or HELP for help.' "$PAGE" || true)" -eq 1
          test "$(grep -Foc 'Message and data rates may apply.' "$PAGE" || true)" -ge 2

          echo '===== API HEALTH ====='
          HEALTH=$(mktemp)
          CODE=$(curl -L --max-time 30 -sS -o "$HEALTH" -w '%{http_code}' -H 'Cache-Control: no-cache' 'https://f45pompano.com/api/pier/health?probe=10dlc-88f71f4f')
          echo "HEALTH_HTTP: $CODE"
          echo "HEALTH_BODY: $(cat "$HEALTH")"
          rm -f "$PAGE" "$HEALTH"
