name: Table Leads Production Probe

on:
  push:
    branches: [main]
    paths:
      - 'public/tableleads/**'
      - 'public/admin/**'
      - 'functions/api/leads/**'
      - 'functions/tableleads/**'
      - 'functions/events/**'
      - '.github/workflows/tableleads-prod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current admin and event access production
        shell: bash
        run: |
          set -euo pipefail
          base='https://f45pompano.com'
          ok=0
          for i in $(seq 1 18); do
            hub="$(curl -fsSL --max-time 15 "$base/admin/?probe=$GITHUB_SHA" || true)"
            admin="$(curl -fsSL --max-time 15 "$base/tableleads/admin/?probe=$GITHUB_SHA" || true)"
            staff_view="$(curl -fsSL --max-time 15 "$base/admin/event/?probe=$GITHUB_SHA" || true)"
            landing_admin="$(curl -fsSL --max-time 15 "$base/landing/admin/?probe=$GITHUB_SHA" || true)"
            if grep -q 'id="accessView"' <<<"$hub" && \
               grep -q 'id="changeAdminCode"' <<<"$hub" && \
               grep -q 'Admin Settings' <<<"$hub" && \
               ! grep -q 'HANDOFF_KEY' <<<"$hub" && \
               grep -q '/tableleads/admin/app.js?v=9' <<<"$admin" && \
               ! grep -q '<h2>Super Admin Code</h2>' <<<"$admin" && \
               grep -q '/admin/event/app.js?v=1' <<<"$staff_view" && \
               ! grep -q 'Table Leads Login' <<<"$staff_view" && \
               grep -q '/landing/admin/app.js?v=15' <<<"$landing_admin"; then
              ok=1
              echo "Current admin assets verified on attempt $i."
              break
            fi
            echo "Attempt $i: current admin assets have not converged yet."
            sleep 10
          done
          test "$ok" -eq 1

          auth_status="$(curl -sS -o /tmp/auth-status.txt -w '%{http_code}' --max-time 15 "$base/api/leads/auth")"
          staff_status="$(curl -sS -o /tmp/staff-status.txt -w '%{http_code}' --max-time 15 "$base/api/leads/staff/leads")"
          test "$auth_status" = '401'
          test "$staff_status" = '401'
          grep -q 'unauthorized' /tmp/auth-status.txt
          grep -q 'unauthorized' /tmp/staff-status.txt
          echo "Protected auth routes verified."
