name: Table Leads Production Probe

on:
  push:
    branches: [main]
    paths:
      - 'public/tableleads/**'
      - 'public/admin/**'
      - 'public/staff/**'
      - 'public/leads-trials/**'
      - 'public/_redirects'
      - 'public/landing/admin/**'
      - 'public/landing-admin/**'
      - 'functions/api/leads/**'
      - 'functions/tableleads/**'
      - 'functions/events/**'
      - 'build.js'
      - '.github/workflows/tableleads-prod-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify unified admin production
        shell: bash
        run: |
          set -euo pipefail
          base='https://f45pompano.com'
          pre_auth_status="$(curl -sS -o /tmp/pre-auth.txt -w '%{http_code}' --max-time 15 "$base/api/leads/auth")"
          pre_users_status="$(curl -sS -o /tmp/pre-users.txt -w '%{http_code}' --max-time 15 "$base/api/leads/admin/users")"
          echo "Preflight auth=$pre_auth_status users=$pre_users_status"
          echo "Preflight users body: $(cat /tmp/pre-users.txt)"
          ok=0
          for i in $(seq 1 4); do
            staffhub="$(curl -fsSL --max-time 15 "$base/leads-trials/?probe=$GITHUB_SHA" || true)"
            staffaccess="$(curl -fsSL --max-time 15 "$base/leads-trials/access/?probe=$GITHUB_SHA" || true)"
            leads="$(curl -fsSL --max-time 15 "$base/admin/leads/?probe=$GITHUB_SHA" || true)"
            events="$(curl -fsSL --max-time 15 "$base/tableleads/admin/?probe=$GITHUB_SHA" || true)"
            staff="$(curl -fsSL --max-time 15 "$base/admin/event/?probe=$GITHUB_SHA" || true)"
            partner="$(curl -fsSL --max-time 15 "$base/landing/admin/?probe=$GITHUB_SHA" || true)"
            manifest="$(curl -fsSL --max-time 15 "$base/leads-trials/manifest.webmanifest?probe=$GITHUB_SHA" || true)"
            missing=()
            grep -q 'F45 Leads/Trials' <<<"$staffhub" || missing+=("hub-name")
            grep -q '>Trial Intake</a>' <<<"$staffhub" || missing+=("hub-trial")
            grep -q '>Table Events</button>' <<<"$staffhub" || missing+=("hub-events")
            grep -q '>Admin</button>' <<<"$staffhub" || missing+=("hub-admin")
            grep -q 'Access Management' <<<"$staffhub" || missing+=("hub-access")
            grep -q '← Admin' <<<"$leads" || missing+=("leads-back")
            grep -q 'Mark as Handled' <<<"$leads" || missing+=("leads-wording")
            grep -q '/tableleads/admin/app.js?v=10' <<<"$events" || missing+=("events-v10")
            grep -q '← Admin' <<<"$events" || missing+=("events-back")
            grep -q '/admin/event/app.js?v=1' <<<"$staff" || missing+=("staff-app")
            grep -q '/landing/admin/app.js?v=14' <<<"$partner" || missing+=("partner-v14")
            grep -q 'admin-handoff' <<<"$partner" || missing+=("partner-handoff")
            grep -q '← Admin' <<<"$partner" || missing+=("partner-back")
            grep -q 'Access Management' <<<"$staffaccess" || missing+=("access-page")
            grep -q 'Trial Intake' <<<"$staffaccess" || missing+=("access-trial")
            grep -q 'F45 Leads/Trials' <<<"$manifest" || missing+=("manifest-name")
            if [ "${#missing[@]}" -eq 0 ]; then
              ok=1
              echo "Current F45 Leads/Trials assets verified on attempt $i."
              break
            fi
            echo "Attempt $i missing: ${missing[*]}"
            sleep 10
          done
          test "$ok" -eq 1

          intake_location="$(curl -sS -o /dev/null -D - --max-time 15 "$base/intake" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | tail -1)"
          admin_location="$(curl -sS -o /dev/null -D - --max-time 15 "$base/admin/" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | tail -1)"
          staff_location="$(curl -sS -o /dev/null -D - --max-time 15 "$base/staff/" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}' | tail -1)"
          test "$intake_location" = "/leads-trials/"
          test "$admin_location" = "/leads-trials/"
          test "$staff_location" = "/leads-trials/"
          echo "Legacy Intake/Admin/Staff redirects verified."

          auth_status="$(curl -sS -o /tmp/auth.txt -w '%{http_code}' --max-time 15 "$base/api/leads/auth")"
          all_status="$(curl -sS -o /tmp/all.txt -w '%{http_code}' --max-time 15 "$base/api/leads/admin/all")"
          tracked_status="$(curl -sS -o /tmp/tracked.txt -w '%{http_code}' --max-time 15 -X POST "$base/api/leads/admin/tracked" -H 'content-type: application/json' --data '{"id":"probe","tracked":true}')"
          users_status="$(curl -sS -o /tmp/users.txt -w '%{http_code}' --max-time 15 "$base/api/leads/admin/users")"
          test "$auth_status" = '401'
          test "$all_status" = '401'
          test "$tracked_status" = '401'
          test "$users_status" = '401'
          grep -q 'unauthorized' /tmp/auth.txt
          grep -q 'unauthorized' /tmp/all.txt
          grep -q 'unauthorized' /tmp/tracked.txt
          grep -q 'unauthorized' /tmp/users.txt
          echo "Protected Leads routes verified."
