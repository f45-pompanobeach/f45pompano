name: Purge Admin Cache

on:
  push:
    branches: [main]
    paths:
      - 'public/admin/**'
      - '.github/workflows/purge-admin-cache.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  purge:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Validate Cloudflare token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN is not available in this repository"
            exit 2
          fi

      - name: Purge unified admin and PWA URLs
        shell: bash
        run: |
          set -euo pipefail
          ZONE_JSON=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones?name=f45pompano.com")
          ZONE_ID=$(printf '%s' "$ZONE_JSON" | jq -r '.result[0].id // empty')
          if [ -z "$ZONE_ID" ]; then
            echo "Unable to resolve Cloudflare zone for f45pompano.com"
            printf '%s\n' "$ZONE_JSON"
            exit 3
          fi

          PURGE_JSON=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"files":[
              "https://f45pompano.com/admin/",
              "https://f45pompano.com/admin/index.html",
              "https://f45pompano.com/admin/access/",
              "https://f45pompano.com/admin/access/index.html",
              "https://f45pompano.com/admin/manifest.webmanifest",
              "https://f45pompano.com/admin/sw.js",
              "https://f45pompano.com/admin/icon.svg",
              "https://www.f45pompano.com/admin/",
              "https://www.f45pompano.com/admin/index.html",
              "https://www.f45pompano.com/admin/access/",
              "https://www.f45pompano.com/admin/access/index.html",
              "https://www.f45pompano.com/admin/manifest.webmanifest",
              "https://www.f45pompano.com/admin/sw.js",
              "https://www.f45pompano.com/admin/icon.svg"
            ]}')
          printf '%s' "$PURGE_JSON" | jq .
          test "$(printf '%s' "$PURGE_JSON" | jq -r '.success')" = "true"
