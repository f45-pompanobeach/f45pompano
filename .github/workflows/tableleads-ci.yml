name: Table Leads CI

on:
  push:
    branches: [main, tableleads-v3]
    paths:
      - 'public/tableleads/**'
      - 'public/admin/**'
      - 'public/staff/**'
      - 'public/leads-trials/**'
      - 'public/_redirects'
      - 'public/landing/admin/**'
      - 'public/landing-admin/**'
      - 'build.js'
      - 'package.json'
      - 'data/*.json'
      - 'scripts/lead-form-pilot.js'
      - 'scripts/partner-page-polish.js'
      - 'scripts/root-lead-design.js'
      - 'public/partner-form-checkboxes.css'
      - 'public/mobile-viewport-fixes.css'
      - 'public/lead-form-pilot.js'
      - 'public/lead-form-pilot.css'
      - 'public/root-lead-design.js'
      - 'public/root-lead-design.css'
      - 'public/landing-runtime.js'
      - 'public/page-visit-tracker.js'
      - 'public/visitor-activity.js'
      - 'functions/api/page-tracking/**'
      - 'functions/api/leads/**'
      - 'functions/tableleads/**'
      - '.github/workflows/tableleads-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Table Leads JavaScript
        run: |
          set -euo pipefail
          node --check public/tableleads/admin/app.js
          node --check public/tableleads/login/app.js
          node --check public/tableleads/form.js
          node --check public/tableleads/modal-scroll.js
          node --check public/tableleads/save-state.js
          node --check public/tableleads/sw.js
          node --check public/admin/event/app.js
          node --check public/admin/sw.js
          node --check public/landing/admin/app.js
          node --check build.js
          node --check scripts/lead-form-pilot.js
          node --check scripts/partner-page-polish.js
          node --check scripts/root-lead-design.js
          node --check public/root-lead-design.js
          node --check public/lead-form-pilot.js
          node --check public/landing-runtime.js
          node --check public/page-visit-tracker.js
          node --check public/visitor-activity.js
          node --check functions/api/page-tracking/index.js
          node --check functions/api/page-tracking/_activity.js
          node --check functions/api/page-tracking/activity/index.js
          node --check functions/api/page-tracking/mindbody-click/index.js
          node --check functions/api/page-tracking/_notifications.js
          node --check functions/api/page-tracking/_return_alerts.js
          node --check functions/api/page-tracking/admin/notifications.js
          node --check functions/api/page-tracking/admin/index.js
          node --check functions/api/page-tracking/admin/activity/index.js
          node --check functions/api/leads/_shared.js
          node --check functions/api/leads/auth.js
          node --check functions/api/leads/register.js
          node --check functions/api/leads/intake.js
          node --check functions/api/leads/admin/all.js
          node --check functions/api/leads/admin/tracked.js
          node --check functions/api/leads/admin/users.js
          node --check functions/api/leads/admin/events.js
          node --check functions/api/leads/admin/leads.js
          node --check functions/api/leads/admin/status.js
          node --check functions/api/leads/staff/leads.js
          node --check functions/api/leads/staff/status.js
          node --check functions/tableleads/confirm.js
      - name: Build site
        run: npm run build
      - name: Verify unified lead form checkboxes and removed duplicate CTAs
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const file of ['dist/sarpinos.html','dist/sarpinos/index.html',
              'dist/foxtail/index.html','dist/_landing-template/index.html']){
            const html=fs.readFileSync(file,'utf8');
            if(!html.includes('id="partnerLeadForm"'))throw Error(file+' missing lead form');
            if(!html.includes('/partner-form-checkboxes.css?v=1'))
              throw Error(file+' missing standardized checkbox stylesheet');
            if(html.includes('<div class="mid-cta-bar">') ||
               html.includes('Ready to try F45 Pompano Beach?') ||
               html.includes("Don't Miss Out — Your Spot Won't Last Long"))
              throw Error(file+' contains a duplicate trial promo strip');
            for(const id of ['partnerTermsPrivacy','partnerEligibilityConfirm','partnerSmsConsent']){
              if((html.match(new RegExp('id="'+id+'"','g'))||[]).length!==1)
                throw Error(file+' expected one '+id);
            }
          }
          const social=fs.readFileSync('dist/social-trial/index.html','utf8');
          if(social.includes('/partner-form-checkboxes.css?v=1'))
            throw Error('Social Trial should not receive partner form CSS');
          console.log('Checked partner landing pages: no redundant CTA strips; checkboxes preserved.');
          NODE
      - name: Check all partner lead-form pages and shared design
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const slugs=fs.readdirSync('data').filter(x=>x.endsWith('.json') &&
            !['shared.json','generic.json','meta.json'].includes(x))
            .map(x=>JSON.parse(fs.readFileSync(path.join('data',x),'utf8')).slug);
          const targets=slugs.flatMap(slug=>[
            {file:'dist/'+slug+'.html',slug},
            {file:'dist/'+slug+'/index.html',slug}
          ]);
          targets.push({file:'dist/_landing-template/index.html',slug:'_landing-template'});
          for(const {file,slug} of targets){
            const html=fs.readFileSync(file,'utf8');
            for(const id of ['partnerLeadForm','claimSuccess','partnerEligibilityConfirm',
                'partnerTermsPrivacy','partnerSmsConsent','offer-video','claim-form']){
              if((html.match(new RegExp('id="'+id+'"','g'))||[]).length!==1)
                throw Error(file+' expected exactly one '+id);
            }
            for(const marker of ['lead-pilot-offer-column','lead-pilot-video-panel',
              'lead-pilot-mobile-bar','lead-pilot-eligibility-details',
              'lead-pilot-eligible-zips','/lead-form-pilot.css?v=3',
              '/lead-form-pilot.js?v=3','/landing-runtime.js?v=11',
              '/partner-form-checkboxes.css?v=1','page-visit-tracker.js',
              'action="/api/leads/intake"']){
              if(!html.includes(marker))throw Error(file+' missing '+marker);
            }
            for(const [id,required] of [['partnerTermsPrivacy',true],
                ['partnerEligibilityConfirm',true],['partnerSmsConsent',false]]){
              const input=html.match(new RegExp('<input[^>]*id="'+id+'"[^>]*>'));
              if(!input)throw Error(file+' missing input '+id);
              if(input[0].includes('required')!==required)
                throw Error(file+' required/optional consent changed: '+id);
            }
            if(html.includes('class="partner-exclusive-header"')||
              html.includes('Submit your info first. Then your exclusive')||
              html.includes('class="mid-cta-bar"'))
              throw Error(file+' redundant trial promotion present');
            if(slug==='sands-harbor'){
              if(html.includes('Continue to Mindbody'))
                throw Error(file+' special follow-up replaced with Mindbody');
              if(!html.includes('Our team will reach out'))
                throw Error(file+' follow-up confirmation missing');
            }else if(!html.includes('Continue to Mindbody')){
              throw Error(file+' checkout link missing');
            }
          }
          const social=fs.readFileSync('dist/social-trial/index.html','utf8');
          if(social.includes('lead-form-pilot.css?v=3')||
             social.includes('lead-form-pilot.js?v=3'))
            throw Error('Social Trial must retain its own direct-checkout design');
          const homepage=fs.readFileSync('dist/index.html','utf8');
          for(const marker of ['class="lead-form-pilot root-lead-design"',
            'lead-pilot-nav-book','lead-pilot-mobile-bar',
            '/root-lead-design.css?v=2','class="root-hero-lead-overlay lead-pilot-shell"',
            '/lead-form-pilot.js?v=3','/partner-form-checkboxes.css?v=1']){
            if(!homepage.includes(marker))throw Error('Homepage missing '+marker);
          }
          if(!homepage.includes('root-hero-lead-overlay')||
             !homepage.includes('partnerLeadForm')||
             !homepage.includes('partnerTermsPrivacy')||
             !homepage.includes('partnerEligibilityConfirm')||
             !homepage.includes('partnerSmsConsent'))
            throw Error('Homepage lost existing consent/form initialization');
          for(const id of ['partnerLeadForm','partnerTermsPrivacy',
            'partnerEligibilityConfirm','partnerSmsConsent','heroVideo','soundToggle']){
            if((homepage.match(new RegExp('id="'+id+'"','g'))||[]).length!==1)
              throw Error('Homepage should render exactly one '+id+' directly');
          }
          if(!homepage.includes('class="root-hero-lead-overlay lead-pilot-shell"') ||
             !homepage.includes('class="lead-pilot-offer-column"') ||
             !homepage.includes('class="lead-pilot-video-panel"'))
            throw Error('Homepage must have static layout before JavaScript runs');
          const eligibilityRow=homepage.match(/<label class="eligibility-confirm-row">[\s\S]*?<\/label>/)?.[0]||'';
          if(!eligibilityRow.includes("I'm a first-time visitor and a qualifying local resident.") ||
             eligibilityRow.includes('one of these ZIP codes'))
            throw Error('Homepage must use the short checkbox wording');
          if(!homepage.includes('class="lead-pilot-eligible-zips"') ||
             !homepage.includes('class="lead-pilot-eligibility-details"'))
            throw Error('Homepage ZIP details dropdown missing');
          if(!homepage.includes('/landing-runtime.js?v=12'))
            throw Error('Homepage must load fresh eligibility runtime');
          console.log('Checked '+targets.length+' generated partner pages and the dynamic partner template.');
          NODE
      - name: Verify universal tracking and page-tracking activity popup
        run: |
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          for(const file of ['dist/index.html','dist/social-trial/index.html',
            'dist/sarpinos/index.html','dist/_landing-template/index.html']){
            const html=fs.readFileSync(file,'utf8');
            for(const asset of ['/page-visit-tracker.js?v=6','/visitor-activity.js?v=14'])
              assert(html.includes(asset),file+' missing '+asset);
            assert(html.includes('/mobile-viewport-fixes.css?v=1'),file+' missing mobile viewport CSS');
            assert(html.includes('class="activity-disclosure"'),file+' missing bottom-of-page activity notice');
          }
          const page=fs.readFileSync('dist/leads-trials/page-tracking/index.html','utf8');
          assert(page.includes('id="activityDialog"'));
          assert(page.includes('class="visit-table"'));
          assert(page.includes('class="view-activity-btn"'), 'Each landing row needs a direct View Activity button');
          assert(!page.includes('class="visit-action-select"'), 'Actions dropdown should be removed');
          assert(!page.includes('value="delete">Delete Visit'), 'Per-row delete should be removed');
          assert(page.includes('id="activityContext"'));
          assert(page.includes('id="activityDiagnostics"'), 'Technical diagnostics belong inside View Activity');
          assert(page.includes('id="activityServerContext"'), 'Matched HTML page request must be visible only inside activity details');
          assert(page.includes('server_request:original'), 'Troubleshooting report must include safe server request evidence');
          assert(page.includes('id="activityEngagement"'), 'Engagement details belong inside View Activity');
          assert(page.includes('id="copyDiagnostic"') && page.includes('Copy Full Activity Log'), 'Full activity log copy action missing');
          assert(page.includes('troubleshootingReport=JSON.stringify'), 'Troubleshooting report not wired');
          assert(!page.includes('field_value:e.field_value'), 'Troubleshooting export must not copy field values');
          assert(page.includes('id="trafficReview"'), 'Suspicious-traffic assessment needs a filter');
          assert(page.includes('No diagnostic snapshot was saved'), 'Old visits must show why data is unavailable');
          assert(page.includes('id="activityContactStatus"'));
          assert(page.includes('id="trackingNotificationSettings"'));
          assert(page.includes('id="trackingAlertsEnabled"'));
          assert(page.includes('id="trackingAlertRecipient"'));
          assert(page.includes('id="engagement"'), 'Activity classification filter missing');
          assert(page.includes("second:'2-digit'"), 'Visit timestamps must show seconds for precise record selection');
          assert(page.includes("String(v.session_id||'').slice(0,12)"), 'Visit rows must show session prefix for exact matching');
          assert(page.includes("match(/\\.(\\d{3})/)"), 'Visit timestamps must show milliseconds');
          assert(page.includes('<option value="unlocked">Trial unlocked</option>'), 'Trial unlocked filter missing');
          assert(page.includes("trial_unlock_count"), 'Trial unlock counts must display');
          assert(page.includes("trial_unlocked:'Trial unlocked"), 'Unlock event timeline must be descriptive');
          assert(page.includes('Page view only'), 'Page-only visits must be labeled clearly');
          assert(page.includes('Mindbody link clicked'), 'Actual Mindbody link clicks must be distinguished');
          assert(page.includes('Blocked checkout attempts: '), 'Blocked checkout attempts should be visible');
          const pageTrackingAPI=fs.readFileSync('functions/api/page-tracking/admin/index.js','utf8');
          assert(pageTrackingAPI.includes('AS engagement_count'), 'Visit summary must return engagement totals');
          assert(pageTrackingAPI.includes('AS blocked_checkout_count'), 'Visit summary must count blocked checkout attempts');
          assert(pageTrackingAPI.includes('AS trial_unlock_count'), 'Visit summary must count successful unlocks');

          assert(page.includes('id="summaryRange"'), 'Summary date-range heading missing');
          assert(page.includes('class="summary-date-range"'), 'Date range must appear in summary');
          assert(page.includes('id="from" type="date"')&&page.includes('id="to" type="date"'), 'Date picker fields missing');
          assert(!page.includes('id="dailyTraffic"'), 'Daily traffic table should be removed');
          assert(page.includes('id="selectPage"')&&page.includes('class="selectVisit"'), 'Tracking row checkboxes missing');
          assert(page.includes('width:38px;min-width:38px;max-width:38px'), 'Selection column should be compact');
          assert(page.includes('.visit-table{table-layout:auto;width:max-content;max-width:none}'), 'Tracking table must shrink to its intrinsic content width');
          assert(!page.includes('.visit-table{table-layout:fixed'), 'Tracking table must not use fixed layout');
          assert(page.includes('.visit-table.has-select th:nth-child(2){max-width:155px}'), 'Date column must have a compact max-width');
          assert(page.includes('.visit-table.has-select th:nth-child(4){max-width:310px}'), 'Source column must be capped');
          assert(page.includes("button.view-activity-btn"), 'View Activity button must open the existing activity panel');
          assert(page.includes('id="deleteSelected"'), 'Bulk delete action missing');
          assert(page.includes("method:'PATCH'"), 'Bulk delete endpoint not connected');
          const trackingAdmin=fs.readFileSync('functions/api/page-tracking/admin/index.js','utf8');
          assert(trackingAdmin.includes('export async function onRequestPatch'), 'Bulk delete endpoint missing');
          assert(trackingAdmin.includes("selected.length>100"), 'Bulk delete size must be capped');
          assert(page.includes('id="saveTrackingAlerts"'));
          assert(page.includes('/api/page-tracking/admin/notifications'));
          assert(page.includes("location.replace('/leads-trials/?next='+encodeURIComponent(location.pathname+location.search))"), 'Expired tracking links must preserve target');
          const entry=fs.readFileSync('public/leads-trials/index.html','utf8');
          assert(entry.includes('function openReturn(role,user)'), 'PIN login must resume exact tracking record');
          assert(entry.includes("if(returnTo){showStaff();openPin('admin');return}"), 'Expired deep link must prompt for PIN');
          const auth=fs.readFileSync('functions/api/leads/auth.js','utf8');
          assert(auth.includes('createSuperAdminSession(env,identity.hash)'), 'Super Admin login must use revocable session');
          assert(auth.includes('deleteSuperAdminSession(request,env)'), 'Logout must revoke Super Admin session');
          const shared=fs.readFileSync('functions/api/leads/_shared.js','utf8');
          assert(shared.includes('lead_super_admin_sessions'), 'Super Admin server sessions must be persisted');
          assert(page.includes('font-size:16px!important'), 'Page Tracking must prevent iOS focus zoom');
          assert(!page.includes('<th data-sort="session_id"'), 'Session should not be a standalone column');
          for(const match of page.matchAll(/<script>([\s\S]*?)<\/script>/g))
            new vm.Script(match[1]);
          const browser=fs.readFileSync('public/visitor-activity.js','utf8');
          assert(!browser.includes('askProgressConsent'), 'Extra progress checkbox must not be injected');
          assert(browser.includes('form#partnerLeadForm'));
          assert(browser.includes('window.top!==window.self'), 'Activity must ignore iframe previews');
          assert(browser.includes("document.visibilityState!=='visible'"), 'Activity must ignore hidden previews');
          const visitTracker=fs.readFileSync('public/page-visit-tracker.js','utf8');
          assert(visitTracker.includes('window.top!==window.self'), 'Visits must ignore iframe previews');
          assert(visitTracker.includes("document.visibilityState!=='visible'"), 'Visits must ignore hidden previews');
          assert(visitTracker.includes('foreground:true'), 'Visible visits must be marked as foreground');
          assert(browser.includes('foreground:true,events'), 'Visible activity must be marked as foreground');
          assert(browser.includes("record('page_resumed',null)"), 'Reopened tabs must log resumed activity');
          const returnAlerts=fs.readFileSync('functions/api/page-tracking/_return_alerts.js','utf8');
          assert(returnAlerts.includes('page_tracking_activity_alerts'), 'Activity email requires a session-level claim');
          assert(returnAlerts.includes('PRIMARY KEY(page,session_id)'), 'Only one activity email per browser session');
          assert(returnAlerts.includes("event_name==='page_hidden'"), 'Leaving after contact edits can send consolidated email');
          assert(returnAlerts.includes("e.event_name!=='form_submit_attempt'"), 'Form submission should wait for its result before sending');
          assert(returnAlerts.includes('tracking-activity-session-'), 'Activity email idempotency key must be stable');
          assert(returnAlerts.includes('delayedDeparture'), 'Exit beacons arriving before a pending edit must still trigger one email');
          assert(returnAlerts.includes('FROM landing_page_activity WHERE page=? AND session_id=?'), 'Consolidated email must summarize the whole browser session');
          assert(returnAlerts.includes("if(!hasTrigger)return"), 'Contact edits alone must not email immediately');
          const visitAlerts=fs.readFileSync('functions/api/page-tracking/_notifications.js','utf8');
          assert(!visitAlerts.includes('ALERT_COOLDOWN_MS'), 'Do not throttle genuine new sessions by browser or IP');
          assert(!visitAlerts.includes('SURGE_EMAIL_LIMIT'), 'Do not suppress genuine sessions under a global burst cap');
          assert(visitAlerts.includes('page_tracking_session_alerts'), 'Initial email must be claimed by page and session');
          assert(visitAlerts.includes('same_browser_session'), 'Duplicate session alerts must be suppressed');
          assert(visitAlerts.includes("BOT_UA.test(ua)"), 'Known automated previews should not email');
          assert(returnAlerts.includes("e.event_name==='trial_unlocked'"), 'Successful unlock is a meaningful action');
          const visitPost=fs.readFileSync('functions/api/page-tracking/index.js','utf8');
          assert(visitPost.includes('session_id:session'), 'Initial visit alerts must use the browser session ID');
          assert(returnAlerts.includes('page_tracking_activity_periods'), 'Previously notified visits must not be emailed again');
          assert(returnAlerts.includes('page_tracking_activity_alerts'), 'Activity notification claim must be persisted');
          assert(browser.includes("record('trial_cta_clicked',a)"), 'Trial call-to-action link clicks must be captured');
          assert(browser.includes("record('checkout_blocked',a,'eligibility_not_confirmed')"), 'Ineligible checkout attempts must not be recorded as successful clicks');
          assert(browser.includes("record('trial_unlocked',success)"), 'Successful lead form must log a trial unlock');
          for(const ev of ['scroll_25','scroll_50','scroll_75','scroll_100','visible_duration','client_error']){
            assert(browser.includes("'"+ev+"'")||browser.includes("scroll_'+n"),'Browser engagement event missing: '+ev);
          }
          const diagnostic=fs.readFileSync('functions/api/page-tracking/_diagnostics.js','utf8');
          assert(diagnostic.includes('ensureDiagnosticSchema'), 'Diagnostics must use independent schema');
          assert(diagnostic.includes("request.cf"), 'Network metadata must come from Cloudflare request');
          assert(diagnostic.includes('networkToken'), 'Network correlation must be keyed');
          assert(!diagnostic.includes('ip_address TEXT'), 'Raw IP addresses must not be stored');
          assert(diagnostic.includes("rapid_network_burst"), 'Suspicious bursts should be flagged only for review');
          const visitHandler=fs.readFileSync('functions/api/page-tracking/index.js','utf8');
          assert(visitHandler.includes('captureDiagnostics'), 'Visit handler must store diagnostics');
          assert(visitHandler.includes("request_id"), 'Visit must link to server-side HTML request');
          const requestAudit=fs.readFileSync('functions/api/page-tracking/_request_audit.js','utf8');
          assert(requestAudit.includes('page_tracking_request_audit'), 'Independent HTML request audit table missing');
          assert(requestAudit.includes('sec-fetch-site'), 'HTML request fetch-site must be captured');
          assert(requestAudit.includes("referer"), 'Referrer domain must be captured');
          assert(!requestAudit.includes('ip_address TEXT'), 'HTML request audit must not retain raw IP');
          assert(requestAudit.includes('30*86400000'), 'Request audit retention must be bounded');
          const middleware=fs.readFileSync('functions/_middleware.js','utf8');
          assert(middleware.includes('recordHtmlRequest'), 'Middleware must audit HTML GETs');
          assert(middleware.includes('f45-request-id'), 'HTML request trace meta must be emitted');
          assert(visitTracker.includes('data.request_id=trace'), 'Client must return HTML request trace');
          const viewDetail=fs.readFileSync('functions/api/page-tracking/admin/activity/index.js','utf8');
          assert(viewDetail.includes('server_request:safeRequest'), 'Authorized activity detail must include matched request');
          assert(!visitAlerts.includes('page_tracking_request_audit'), 'Request audit must not create new emails');
          const activityDetail=fs.readFileSync('functions/api/page-tracking/admin/activity/index.js','utf8');
          assert(activityDetail.includes('safeDiagnostics'), 'Diagnostics must require activity authorization');
          assert(activityDetail.includes('max_scroll_percent'), 'View Activity must expose engagement summary');
          const privacy=fs.readFileSync('public/privacy/index.html','utf8');
          assert(privacy.includes('short-lived keyed network token'), 'Privacy policy must disclose network diagnostics');
          assert(browser.includes("flushPending();"), 'Pending form input must be captured before CTA email');
          assert(browser.includes("while(queue.length)"), 'Unsent events must not be discarded on page departure');
          assert(fs.readFileSync('functions/api/page-tracking/_return_alerts.js','utf8').includes("e.event_name==='checkout_blocked'"), 'Later blocked CTA attempts should be treated as meaningful attempts, not successful checkouts');
          const trackingEvents=fs.readFileSync('functions/api/page-tracking/_activity.js','utf8');
          assert(trackingEvents.includes("'checkout_blocked'"), 'Blocked checkout event must be accepted');
          const checkoutAPI=fs.readFileSync('functions/api/page-tracking/mindbody-click/index.js','utf8');
          assert(!checkoutAPI.includes('visited_at>=?'), 'Eligible click should reuse original tracking session');

          assert(browser.includes("dirtyFields.has(key)"), 'Untouched restored fields must not be re-snapshotted');
          assert(!browser.includes("record('field_started'"), 'Focusing fields must not be tracked');
          assert(!browser.includes("record('field_left'"), 'Leaving fields must not be tracked');
          const activityFilter=fs.readFileSync('functions/api/page-tracking/activity/index.js','utf8');
          assert(activityFilter.includes("e.event_name!=='field_started'&&e.event_name!=='field_left'"), 'Cached focus/blur events must be ignored by server');
          const activityHandler=fs.readFileSync('functions/api/page-tracking/activity/index.js','utf8');
          assert(activityHandler.includes("latestFields.get(e.field_name)===e.field_value"), 'Saved field values must suppress repeat entries');
          assert(activityHandler.includes("const fresh=changed.filter"), 'Only changed/new activity should trigger email');
          assert(page.includes("new URLSearchParams(location.search).get('visit')"), 'Email must deep-link to exact activity row');
          for(const endpoint of ['functions/api/page-tracking/index.js','functions/api/page-tracking/activity/index.js']){
            const server=fs.readFileSync(endpoint,'utf8');
            assert(server.includes("page==='root'&&d?.foreground!==true"), 'Legacy phantom root protection missing from '+endpoint);
          }
          const visitEndpoint=fs.readFileSync('functions/api/page-tracking/index.js','utf8');
          const activityEndpoint=fs.readFileSync('functions/api/page-tracking/activity/index.js','utf8');
          assert(visitEndpoint.includes('WHERE page=? AND session_id=?)'), 'Visit must deduplicate restored tab regardless of age');
          assert(!visitEndpoint.includes('AND visited_at>=?)'), 'Do not expire per-tab visit deduplication');
          assert(activityEndpoint.includes('WHERE page=? AND session_id=? ORDER BY visited_at DESC LIMIT 1'), 'Activity must reuse original restored-tab row');
          assert(!activityEndpoint.includes('AND visited_at>=? ORDER BY visited_at DESC LIMIT 1'), 'Activity must not create a second row on tab restore');
          assert(!browser.includes('optIn'), 'No opt-in checkbox dependency may remain');
          assert(browser.includes('pagehide'));
          assert(browser.includes("snapshotContactFields(document.getElementById('partnerLeadForm'),'exit_snapshot')"));
          assert(browser.includes("'zip_code_on_id'"));
          assert(!browser.includes('input[type=password]'));
          console.log('Universal events, opt-in and timeline dialog checked.');
          NODE
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import {sanitizeEvent} from './functions/api/page-tracking/_activity.js';
          const id='f179d53e-68cb-4ce3-97a9-0e0ae37b580a';
          assert.equal(sanitizeEvent({id,event:'field_edited',field:'email',
            value:'visitor@example.com',consented:false}).field_value,'visitor@example.com');
          assert.equal(sanitizeEvent({id,event:'field_edited',field:'email',
            value:'visitor@example.com',consented:true}).field_value,'visitor@example.com');
          assert.equal(sanitizeEvent({id,event:'field_edited',field:'zip',
            value:'33062',consented:true}).field_value,'33062');
          assert.equal(sanitizeEvent({id,event:'field_edited',field:'first_name',
            value:'Jamie',consented:true}).field_value,'Jamie');
          assert.equal(sanitizeEvent({id,event:'field_edited',field:'zip',
            value:'33062',consented:false}).field_value,'33062');
          assert.equal(sanitizeEvent({id,event:'field_edited',field:'password',
            value:'secret',consented:true}).field_value,null);
          assert.equal(sanitizeEvent({id,event:'keyboard_log'}),null);
          console.log('Server protects non-consented values and rejects unapproved events.');
          NODE
      - name: Parse generated homepage inline scripts
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const html = fs.readFileSync('dist/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)];
          scripts.forEach((match, index) => new vm.Script(match[1], { filename: 'dist/index.html:inline-script-' + index }));
          console.log('Parsed ' + scripts.length + ' generated homepage inline scripts.');
