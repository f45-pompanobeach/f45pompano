<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Page Tracking · F45 Pompano</title><style>
body{font:15px Inter,Arial,sans-serif;background:#f4f5f7;color:#1c1c2e;margin:0;padding:20px}main{max-width:1050px;margin:auto}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0001}a{color:#1c1c2e}select,button,input[type=date]{padding:11px;border-radius:8px;border:1px solid #cbd0d9;background:white;font-size:14px}button{background:#1c1c2e;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}th{font-size:13px;cursor:pointer;user-select:none}th:focus-visible{outline:2px solid #2563eb}th[aria-sort]{white-space:nowrap}small{color:#626879}.scroll{max-height:65vh;overflow:auto}
</style></head><body><main><a href="/leads-trials/">← Leads &amp; Trials</a><h1>Page Tracking</h1><div class="panel"><label for="page">Landing / partner page: </label><select id="page"><option value="">All pages</option></select> <label for="source">Source:</label> <select id="source"><option value="">All sources</option></select> <label for="campaign">Campaign:</label> <select id="campaign"><option value="">All campaigns</option></select> <label for="medium">Medium:</label> <select id="medium"><option value="">All media</option></select> <label for="ad">Ad / Content:</label> <select id="ad"><option value="">All ads</option></select> <label for="from">From:</label> <input id="from" type="date" aria-label="Start date"> <label for="to">To:</label> <input id="to" type="date" aria-label="End date"> <label><input id="excludeTests" type="checkbox" checked> Hide test visits</label> <button id="refresh">Refresh</button><p id="stats">Loading…</p><small>Visit times are Eastern. Browser sessions are estimates, not identified people. Match to Meta inquiry emails by approximate time only.</small></div><div class="panel scroll"><table><thead><tr><th data-sort="visited_at" tabindex="0" aria-sort="descending">Visit date/time (Eastern) ↓</th><th data-sort="page" tabindex="0">Landing page</th><th data-sort="source" tabindex="0">Source</th><th data-sort="campaign" tabindex="0">Campaign</th><th data-sort="ad" tabindex="0">Ad / Content</th><th data-sort="referrer" tabindex="0">Referrer</th><th data-sort="session_id" tabindex="0">Session</th></tr></thead><tbody id="history"></tbody></table></div></main><script>
(async function(){
 const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let visits=[],sortKey="visited_at",sortDir=-1;
 const easternDate=v=>new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date(v.visited_at)).replace(/(\d{2})\/(\d{2})\/(\d{4})/,"$3-$1-$2");
 const isTest=v=>["tracking_test","yelp_test"].includes((v.utm_campaign||"").toLowerCase());
 const sortValue=(v,k)=>k==="source"?sourceOf(v):k==="campaign"?(v.utm_campaign||""):k==="ad"?adOf(v):k==="referrer"?(v.referrer||""):String(v[k]||"");
 function adOf(v){return v.ad_id||v.utm_content||''}
 function sourceOf(v){if(v.utm_source)return v.utm_source;try{return v.referrer?new URL(v.referrer).hostname:'Direct / Unknown'}catch{return 'Direct / Unknown'}}
 function render(){
 const page=el('page').value,source=el('source').value,campaign=el('campaign').value,medium=el('medium').value,ad=el('ad').value,from=el('from').value,to=el('to').value;
 const shown=visits.filter(v=>(!el('excludeTests').checked||!isTest(v))&&(!page||v.page===page)&&(!source||sourceOf(v)===source)&&(!campaign||v.utm_campaign===campaign)&&(!medium||v.utm_medium===medium)&&(!ad||adOf(v)===ad)&&(!from||easternDate(v)>=from)&&(!to||easternDate(v)<=to));
 shown.sort((a,b)=>sortDir*sortValue(a,sortKey).localeCompare(sortValue(b,sortKey),undefined,{numeric:true,sensitivity:'base'}));
 const sessions=new Set(shown.map(v=>v.page+':'+v.session_id)).size;
 el('stats').textContent=shown.length+' matching visits · '+sessions+' browser sessions · latest 1,500 records available';
 el('history').innerHTML=shown.map(v=>'<tr><td>'+esc(new Date(v.visited_at).toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'medium'}))+'</td><td>'+esc(v.page)+'</td><td>'+esc(sourceOf(v))+'</td><td>'+esc(v.utm_campaign||'—')+'</td><td>'+esc(adOf(v)||'—')+'</td><td>'+esc(v.referrer||'—')+'</td><td>'+esc(v.session_id.slice(0,8))+'…</td></tr>').join('')||'<tr><td colspan="7">No matching visits.</td></tr>';
 document.querySelectorAll('th[data-sort]').forEach(th=>{const active=th.dataset.sort===sortKey;th.textContent=th.textContent.replace(/ [↑↓]$/,'')+(active?(sortDir===1?' ↑':' ↓'):'');if(active)th.setAttribute('aria-sort',sortDir===1?'ascending':'descending');else th.removeAttribute('aria-sort')});
 }

 function options(id,values,all){const prev=el(id).value;el(id).innerHTML='<option value="">'+all+'</option>'+[...new Set(values.filter(Boolean))].sort().map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');el(id).value=prev}

 async function load(){el('stats').textContent='Loading…';try{const code=sessionStorage.getItem('table_admin_code')||sessionStorage.getItem('table_access_code')||'',headers={};if(/^\d{4}$/.test(code))headers['x-table-code']=code;const r=await fetch('/api/page-tracking/admin/',{headers,cache:'no-store'});if(r.status===401){throw Error('Access not authorized for Page Tracking. Please return to Leads & Trials, log out, then sign in again with your Admin PIN.')}if(!r.ok)throw Error('Unable to load visit history');visits=(await r.json()).visits||[];options('page',visits.map(v=>v.page),'All pages');options('source',visits.map(sourceOf),'All sources');options('campaign',visits.map(v=>v.utm_campaign),'All campaigns');options('medium',visits.map(v=>v.utm_medium),'All media');options('ad',visits.map(adOf),'All ads');render()}catch(e){el('stats').textContent=e.message}}
 ['page','source','campaign','medium','ad','from','to','excludeTests'].forEach(id=>el(id).addEventListener('change',render));document.querySelectorAll('th[data-sort]').forEach(th=>{const toggle=()=>{if(sortKey===th.dataset.sort)sortDir*=-1;else{sortKey=th.dataset.sort;sortDir=sortKey==='visited_at'?-1:1}render()};th.addEventListener('click',toggle);th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}})});el('refresh').addEventListener('click',load);load();
})();
</script></body></html>
