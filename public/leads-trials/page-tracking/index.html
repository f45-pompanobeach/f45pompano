<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Page Tracking · F45 Pompano</title><style>
body{font:15px Inter,Arial,sans-serif;background:#f4f5f7;color:#1c1c2e;margin:0;padding:20px}main{max-width:1050px;margin:auto}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0001}a{color:#1c1c2e}select,button{padding:11px;border-radius:8px;border:1px solid #cbd0d9;background:white;font-size:14px}button{background:#1c1c2e;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}th{font-size:13px}small{color:#626879}.scroll{max-height:65vh;overflow:auto}
</style></head><body><main><a href="/leads-trials/">← Leads &amp; Trials</a><h1>Page Tracking</h1><div class="panel"><label for="page">Landing / partner page: </label><select id="page"><option value="">All pages</option></select> <label for="source">Source:</label> <select id="source"><option value="">All sources</option></select> <label for="campaign">Campaign:</label> <select id="campaign"><option value="">All campaigns</option></select> <label for="medium">Medium:</label> <select id="medium"><option value="">All media</option></select> <label for="ad">Ad / Content:</label> <select id="ad"><option value="">All ads</option></select> <button id="refresh">Refresh</button><p id="stats">Loading…</p><small>Visit times are Eastern. Browser sessions are estimates, not identified people. Match to Meta inquiry emails by approximate time only.</small></div><div class="panel scroll"><table><thead><tr><th>Visit date/time (Eastern)</th><th>Landing page</th><th>Source</th><th>Campaign</th><th>Ad / Content</th><th>Referrer</th><th>Session</th></tr></thead><tbody id="history"></tbody></table></div></main><script>
(async function(){
 const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let visits=[];
 function adOf(v){return v.ad_id||v.utm_content||''}
 function sourceOf(v){if(v.utm_source)return v.utm_source;try{return v.referrer?new URL(v.referrer).hostname:'Direct / Unknown'}catch{return 'Direct / Unknown'}}
 function render(){const page=el('page').value,source=el('source').value,campaign=el('campaign').value,medium=el('medium').value,ad=el('ad').value,shown=visits.filter(v=>(!page||v.page===page)&&(!source||sourceOf(v)===source)&&(!campaign||v.utm_campaign===campaign)&&(!medium||v.utm_medium===medium)&&(!ad||adOf(v)===ad)),sessions=new Set(shown.map(v=>v.page+':'+v.session_id)).size;el('stats').textContent=shown.length+' recorded visits · '+sessions+' browser sessions · showing latest 1,500 records';el('history').innerHTML=shown.map(v=>'<tr><td>'+esc(new Date(v.visited_at).toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'medium'}))+'</td><td>'+esc(v.page)+'</td><td>'+esc(sourceOf(v))+'</td><td>'+esc(v.utm_campaign||'—')+'</td><td>'+esc(v.ad_id||v.utm_content||'—')+'</td><td>'+esc(v.referrer||'—')+'</td><td>'+esc(v.session_id.slice(0,8))+'…</td></tr>').join('')||'<tr><td colspan="7">No visits recorded.</td></tr>'}
 function options(id,values,all){const prev=el(id).value;el(id).innerHTML='<option value="">'+all+'</option>'+[...new Set(values.filter(Boolean))].sort().map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');el(id).value=prev}

 async function load(){el('stats').textContent='Loading…';try{const code=sessionStorage.getItem('table_admin_code')||sessionStorage.getItem('table_access_code')||'',headers={};if(/^\d{4}$/.test(code))headers['x-table-code']=code;const r=await fetch('/api/page-tracking/admin/',{headers,cache:'no-store'});if(r.status===401){throw Error('Access not authorized for Page Tracking. Please return to Leads & Trials, log out, then sign in again with your Admin PIN.')}if(!r.ok)throw Error('Unable to load visit history');visits=(await r.json()).visits||[];options('page',visits.map(v=>v.page),'All pages');options('source',visits.map(sourceOf),'All sources');options('campaign',visits.map(v=>v.utm_campaign),'All campaigns');options('medium',visits.map(v=>v.utm_medium),'All media');options('ad',visits.map(adOf),'All ads');render()}catch(e){el('stats').textContent=e.message}}
 ['page','source','campaign','medium','ad'].forEach(id=>el(id).addEventListener('change',render));el('refresh').addEventListener('click',load);load();
})();
</script></body></html>
