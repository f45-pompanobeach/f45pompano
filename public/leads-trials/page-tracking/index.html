<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Page Tracking · F45 Pompano</title><style>
body{font:15px Inter,Arial,sans-serif;background:#f4f5f7;color:#1c1c2e;margin:0;padding:20px}main{max-width:1050px;margin:auto}.panel{background:white;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 5px 20px #0001}a{color:#1c1c2e}select,button{padding:11px;border-radius:8px;border:1px solid #cbd0d9;background:white;font-size:14px}button{background:#1c1c2e;color:white;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}th{font-size:13px}small{color:#626879}.scroll{max-height:65vh;overflow:auto}
</style></head><body><main><a href="/leads-trials/">← Leads &amp; Trials</a><h1>Page Tracking</h1><div class="panel"><label for="page">Landing / partner page: </label><select id="page"><option value="">All pages</option></select> <button id="refresh">Refresh</button><p id="stats">Loading…</p><small>Visit times are Eastern. Browser sessions are estimates, not identified people. Match to Meta inquiry emails by approximate time only.</small></div><div class="panel scroll"><table><thead><tr><th>Visit date/time (Eastern)</th><th>Landing page</th><th>Session</th></tr></thead><tbody id="history"></tbody></table></div></main><script>
(async function(){
 const el=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 let visits=[];
 function render(){const page=el('page').value,shown=visits.filter(v=>!page||v.page===page),sessions=new Set(shown.map(v=>v.page+':'+v.session_id)).size;el('stats').textContent=shown.length+' recorded visits · '+sessions+' browser sessions · showing latest 1,500 records';el('history').innerHTML=shown.map(v=>'<tr><td>'+esc(new Date(v.visited_at).toLocaleString('en-US',{timeZone:'America/New_York',dateStyle:'medium',timeStyle:'medium'}))+'</td><td>'+esc(v.page)+'</td><td>'+esc(v.session_id.slice(0,8))+'…</td></tr>').join('')||'<tr><td colspan="3">No visits recorded.</td></tr>'}
 async function load(){el('stats').textContent='Loading…';try{const code=sessionStorage.getItem('table_admin_code')||sessionStorage.getItem('table_access_code')||'',headers={};if(/^\d{4}$/.test(code))headers['x-table-code']=code;const r=await fetch('/api/page-tracking/admin/',{headers,cache:'no-store'});if(r.status===401){location.replace('/leads-trials/');return}if(!r.ok)throw Error('Unable to load visit history');visits=(await r.json()).visits||[];const prev=el('page').value;el('page').innerHTML='<option value="">All pages</option>'+[...new Set(visits.map(v=>v.page))].sort().map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join('');el('page').value=prev;render()}catch(e){el('stats').textContent=e.message}}
 el('page').addEventListener('change',render);el('refresh').addEventListener('click',load);load();
})();
</script></body></html>
