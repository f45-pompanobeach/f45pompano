<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C1C2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="F45 Leads/Trials">
<link rel="manifest" href="/staff/manifest.webmanifest">
<link rel="icon" href="/staff/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/staff/icon.svg">
<title>F45 Leads/Trials</title>
<style>
:root{--navy:#1C1C2E;--red:#E8272A;--yellow:#FFB800;--ink:#20202b;--muted:#707582;--line:#e5e7eb;--bg:#f4f5f7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}body{min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));overflow-x:hidden}.shell{width:min(760px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small{display:block;font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--red)}.brand strong{display:block;font-size:25px;line-height:1.05;color:var(--navy)}button,a{font:inherit}.adminBtn,.logoutBtn{border:0;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.adminBtn{background:var(--navy);color:#fff}.logoutBtn{background:#fff;color:var(--navy);border:1px solid var(--line)}.hero{text-align:center;padding:42px 0 24px}.hero h1{font-size:clamp(34px,8vw,52px);line-height:.95;margin:0;color:var(--navy)}.hero p{margin:10px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:150px;border:0;border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-size:clamp(18px,4.5vw,25px);font-weight:950;line-height:1.05;box-shadow:0 10px 30px rgba(28,28,46,.10);cursor:pointer}.tile.red{background:#fff;color:var(--navy);border:2px solid #f0c3c4;box-shadow:inset 0 6px 0 var(--red),0 10px 30px rgba(28,28,46,.08)}.tile.red:hover{border-color:var(--red)}.tile.navy{background:var(--navy);color:#fff}.tile.white{background:#fff;color:var(--navy);border:2px solid var(--navy)}.tile.yellow{background:#fff7d6;color:var(--navy);border:2px solid #e7b100;box-shadow:inset 0 6px 0 var(--yellow),0 10px 30px rgba(28,28,46,.08)}.sectionTitle{margin:28px 2px 10px;font-size:12px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.hidden{display:none!important}.who{text-align:center;margin:10px 0 0;color:var(--muted);font-size:13px}.modalBack{position:fixed;inset:0;background:rgba(20,22,34,.62);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(440px,100%);background:#fff;border-radius:20px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.28)}.modal h2{margin:0 0 8px;color:var(--navy)}.modal p{color:var(--muted);line-height:1.45;margin:0 0 16px}.pin{width:100%;font-size:28px;letter-spacing:.3em;text-align:center;padding:13px;border:2px solid #c9ced7;border-radius:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:10px;padding:13px 14px;font-weight:900;cursor:pointer}.btn.primary{background:var(--red);color:#fff}.btn.secondary{background:#eceef2;color:var(--navy)}.msg{min-height:18px;margin-top:10px;font-size:12px;font-weight:800;color:#a91d1d}@media(max-width:520px){.tile{min-height:132px;padding:12px}.brand strong{font-size:22px}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><small>F45 POMPANO BEACH</small><strong>Leads/Trials</strong></div>
    <button id="adminBtn" class="adminBtn" type="button">Admin</button>
    <button id="logoutBtn" class="logoutBtn hidden" type="button">Log Out</button>
  </header>

  <section id="staffHome">
    <div class="hero"><h1>Staff Hub</h1><p>Choose what you need.</p></div>

    <div class="sectionTitle">Trials</div>
    <div class="grid">
      <a class="tile navy" href="https://intake.f45pompano.com/">Trial Intake</a>
    </div>

    <div class="sectionTitle">Leads</div>
    <div class="grid" id="leadGrid">
      <button id="tableEventsBtn" class="tile red" type="button">Table Events</button>
      <a id="partnerPagesTile" class="tile red hidden" href="/landing/admin/">Partner Pages</a>
      <a id="leadsTile" class="tile red hidden" href="/admin/leads/">Leads</a>
    </div>
  </section>

  <section id="adminHome" class="hidden">
    <div class="sectionTitle">Administration</div>
    <div class="grid">
      <a id="accessTile" class="tile yellow hidden" href="/staff/access/">Access Management</a>
    </div>
    <div id="adminWho" class="who"></div>
  </section>
</main>

<div id="pinBack" class="modalBack hidden" role="dialog" aria-modal="true">
  <section class="modal">
    <h2 id="pinTitle">Admin Access</h2>
    <p id="pinHelp">Enter your 4-digit PIN.</p>
    <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="one-time-code" placeholder="••••">
    <div id="pinMsg" class="msg"></div>
    <div class="actions"><button id="pinCancel" class="btn secondary" type="button">Cancel</button><button id="pinGo" class="btn primary" type="button">Continue</button></div>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let mode='admin';
const ADMIN_PERMS=['partner_pages','leads'];
function openPin(kind){mode=kind;$('pinTitle').textContent=kind==='event'?'Table Event Access':'Admin Access';$('pinHelp').textContent=kind==='event'?'Enter the 4-digit code for the event you are working.':'Enter your 4-digit PIN.';$('pin').value='';$('pinMsg').textContent='';$('pinBack').classList.remove('hidden');setTimeout(()=>$('pin').focus(),20)}
function closePin(){$('pinBack').classList.add('hidden')}
async function auth(code){const r=await fetch('/api/leads/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});const j=await r.json().catch(()=>({}));return {r,j}}
function eventButton(label='Table Events'){const b=document.createElement('button');b.className='tile red';b.type='button';b.textContent=label;b.onclick=()=>openPin('event');return b}
function showStaff(){
  $('staffHome').classList.remove('hidden');
  $('adminHome').classList.add('hidden');
  $('partnerPagesTile').classList.add('hidden');
  $('leadsTile').classList.add('hidden');
  $('accessTile').classList.add('hidden');
  $('adminBtn').classList.remove('hidden');
  $('logoutBtn').classList.add('hidden');
}
function showDashboard(role,user,rawCode=''){
  $('staffHome').classList.remove('hidden');
  $('adminHome').classList.remove('hidden');
  $('adminBtn').classList.add('hidden');
  $('logoutBtn').classList.remove('hidden');

  const superAdmin=role==='admin';
  const perms=superAdmin?ADMIN_PERMS:((user&&user.permissions)||[]);
  $('partnerPagesTile').classList.toggle('hidden',!perms.includes('partner_pages'));
  $('leadsTile').classList.toggle('hidden',!perms.includes('leads'));
  $('accessTile').classList.toggle('hidden',!superAdmin);

  $('adminWho').textContent=superAdmin?'Super Admin':`Signed in as ${user?.display_name||'User'}`;
  if(/^\d{4}$/.test(rawCode)&&superAdmin){
    sessionStorage.setItem('table_admin_code',rawCode);
    sessionStorage.setItem('landingAdminPin',rawCode);
  }
}
async function submitPin(){
  const code=$('pin').value.trim();$('pinMsg').textContent='';
  if(!/^\d{4}$/.test(code)){$('pinMsg').textContent='Enter exactly 4 digits.';return}
  const {r,j}=await auth(code);
  if(!r.ok||!j.ok){$('pinMsg').textContent=j.message||'That PIN is not valid.';return}
  if(mode==='event'){
    if(j.role!=='event'){$('pinMsg').textContent='That is not a Table Event code.';return}
    sessionStorage.setItem('table_access_code',code);sessionStorage.setItem('table_event_code',code);location.href='/admin/event/';return;
  }
  if(j.role==='admin'||j.role==='user'){closePin();showDashboard(j.role,j.user,code);return}
  $('pinMsg').textContent='Use the Table Events button for an event code.';
}
async function restore(){
  try{const r=await fetch('/api/leads/auth',{cache:'no-store'}),j=await r.json().catch(()=>({}));if(r.ok&&j.ok&&(j.role==='admin'||j.role==='user')){showDashboard(j.role,j.user);return}}catch{}
  showStaff();
}
$('adminBtn').onclick=()=>openPin('admin');$('tableEventsBtn').onclick=()=>openPin('event');$('pinCancel').onclick=closePin;$('pinGo').onclick=submitPin;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()});$('pinBack').addEventListener('click',e=>{if(e.target===$('pinBack'))closePin()});
$('logoutBtn').onclick=async()=>{try{await fetch('/api/leads/auth',{method:'DELETE',cache:'no-store'})}catch{}sessionStorage.removeItem('table_access_code');sessionStorage.removeItem('table_admin_code');sessionStorage.removeItem('table_event_code');sessionStorage.removeItem('landingAdminPin');showStaff()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/staff/sw.js',{scope:'/staff/'}).catch(()=>{});
restore();
})();
</script>
</body>
</html>
