<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C1C2E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="F45 Leads/Trials">
<link rel="manifest" href="/staff/manifest.webmanifest">
<link rel="icon" href="/staff/icon-leads-trials.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/staff/icon-leads-trials.svg">
<title>F45 Leads/Trials</title>
<style>
:root{--purple:#211551;--red:#D6001C;--white:#FFFFFF;--muted:#C9C4DD;--line:rgba(255,255,255,.22)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:var(--purple);color:var(--white)}body{min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));overflow-x:hidden}.shell{width:min(760px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand small{display:block;font-size:11px;font-weight:900;letter-spacing:.14em;color:#ff3348}.brand strong{display:block;font-size:25px;line-height:1.05;color:#fff}button,a{font:inherit}.adminBtn,.logoutBtn{border:0;border-radius:999px;padding:10px 14px;font-weight:900;cursor:pointer}.adminBtn{background:#fff;color:var(--purple)}.logoutBtn{background:transparent;color:#fff;border:2px solid rgba(255,255,255,.55)}.hero{text-align:center;padding:42px 0 24px}.hero h1{font-size:clamp(34px,8vw,52px);line-height:.95;margin:0;color:#fff}.hero p{margin:10px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{min-height:150px;border:0;border-radius:0;padding:18px;display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-size:clamp(18px,4.5vw,25px);font-weight:950;line-height:1.05;cursor:pointer}.tile.red{background:var(--red);color:#fff}.tile.navy{background:var(--red);color:#fff}.tile.white{background:#fff;color:var(--purple)}.tile.yellow{background:#fff;color:var(--purple);border:4px solid var(--red)}.sectionTitle{margin:30px 2px 10px;font-size:13px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#fff}.hidden{display:none!important}.who{text-align:center;margin:12px 0 0;color:var(--muted);font-size:13px}.modalBack{position:fixed;inset:0;background:rgba(10,6,35,.78);display:grid;place-items:center;padding:18px;z-index:50}.modal{width:min(440px,100%);background:#fff;color:var(--purple);border-radius:16px;padding:24px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.modal h2{margin:0 0 8px;color:var(--purple)}.modal p{color:#6f678f;line-height:1.45;margin:0 0 16px}.pin{width:100%;font-size:28px;letter-spacing:.3em;text-align:center;padding:13px;border:2px solid #bdb8cf;border-radius:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.btn{border:0;border-radius:8px;padding:13px 14px;font-weight:900;cursor:pointer}.btn.primary{background:var(--red);color:#fff}.btn.secondary{background:#eeeaf6;color:var(--purple)}.msg{min-height:18px;margin-top:10px;font-size:12px;font-weight:800;color:#b30018}.version{position:fixed;right:10px;bottom:calc(8px + env(safe-area-inset-bottom));font-size:11px;font-weight:900;color:rgba(255,255,255,.72);letter-spacing:.04em;z-index:5}@media(max-width:520px){.tile{min-height:132px;padding:12px}.brand strong{font-size:22px}}
</style>
</head>
<body>
<main class="shell">
  <header class="top">
    <div class="brand"><small>F45 POMPANO BEACH</small><strong>Leads/Trials</strong></div>
    <button id="adminBtn" class="adminBtn" type="button">Admin</button>
    <button id="logoutBtn" class="logoutBtn hidden" type="button">Log Out</button>
  </header>

  <section id="staffHome">
    <div class="hero"><h1>Staff Hub</h1><p>Choose what you need.</p></div>
    <div id="staffPrimary" class="grid">
      <a class="tile red" href="https://intake.f45pompano.com/?staff=1">Trial Intake</a>
      <button id="staffTableEventsBtn" class="tile white" type="button">Table Events</button>
    </div>
  </section>

  <section id="adminHome" class="hidden">
    <section id="trialsSection" class="hidden">
      <div class="sectionTitle">Trials</div>
      <div class="grid">
        <button id="adminIntakeBtn" class="tile red hidden" type="button">Trial Intake</button>
      </div>
    </section>

    <section id="leadManagementSection" class="hidden">
      <div class="sectionTitle">Lead Management</div>
      <div class="grid">
        <a id="adminTableEventsTile" class="tile white hidden" href="/tableleads/admin/">Table Events</a>
        <a id="partnerPagesTile" class="tile white hidden" href="/landing/admin/">Partner Pages</a>
        <a id="leadsTile" class="tile white hidden" href="/admin/leads/">Leads</a>
      </div>
    </section>

    <section id="administrationSection" class="hidden">
      <div class="sectionTitle">Administration</div>
      <div class="grid">
        <a id="accessTile" class="tile yellow hidden" href="/staff/access/">Access Management</a>
      </div>
    </section>
    <div id="adminWho" class="who"></div>
  </section>
</main>
<div class="version">v0.1.4</div>

<div id="pinBack" class="modalBack hidden" role="dialog" aria-modal="true">
  <section class="modal">
    <h2 id="pinTitle">Admin Access</h2>
    <p id="pinHelp">Enter your 4-digit PIN.</p>
    <input id="pin" class="pin" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" autocomplete="one-time-code" placeholder="••••">
    <div id="pinMsg" class="msg"></div>
    <div class="actions"><button id="pinCancel" class="btn secondary" type="button">Cancel</button><button id="pinGo" class="btn primary" type="button">Continue</button></div>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
let mode='admin';
const ADMIN_PERMS=['intake_admin','table_event_admin','partner_pages','leads'];
function openPin(kind){mode=kind;$('pinTitle').textContent=kind==='event'?'Table Event Access':'Admin Access';$('pinHelp').textContent=kind==='event'?'Enter the 4-digit code for the event you are working.':'Enter your 4-digit PIN.';$('pin').value='';$('pinMsg').textContent='';$('pinBack').classList.remove('hidden');setTimeout(()=>$('pin').focus(),20)}
function closePin(){$('pinBack').classList.add('hidden')}
async function auth(code){const r=await fetch('/api/leads/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})});const j=await r.json().catch(()=>({}));return {r,j}}
async function launchIntakeAdmin(){
  const b=$('adminIntakeBtn');
  if(b)b.disabled=true;
  try{
    const r=await fetch('/api/leads/handoff/intake',{method:'POST',headers:{'content-type':'application/json'},body:'{}'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok||!j.token)throw new Error('Could not open Intake Admin.');
    location.href='https://intake.f45pompano.com/?handoff='+encodeURIComponent(j.token);
  }catch(e){
    alert(e.message||'Could not open Intake Admin.');
    if(b)b.disabled=false;
  }
}
function cacheIdentity(role,user){
  try{localStorage.setItem('f45_staff_identity',JSON.stringify({role,user:user||null}))}catch{}
}
function clearIdentity(){try{localStorage.removeItem('f45_staff_identity')}catch{}}
function cachedIdentity(){try{const v=JSON.parse(localStorage.getItem('f45_staff_identity')||'null');return v&&['admin','user'].includes(v.role)?v:null}catch{return null}}
function showStaff(){
  $('staffHome').classList.remove('hidden');
  $('adminHome').classList.add('hidden');
  $('trialsSection').classList.add('hidden');
  $('leadManagementSection').classList.add('hidden');
  $('administrationSection').classList.add('hidden');
  $('adminIntakeBtn').classList.add('hidden');
  $('adminTableEventsTile').classList.add('hidden');
  $('partnerPagesTile').classList.add('hidden');
  $('leadsTile').classList.add('hidden');
  $('accessTile').classList.add('hidden');
  $('adminBtn').classList.remove('hidden');
  $('logoutBtn').classList.add('hidden');
  clearIdentity();
}
function showDashboard(role,user,rawCode=''){
  $('staffHome').classList.add('hidden');
  $('adminHome').classList.remove('hidden');
  $('adminBtn').classList.add('hidden');
  $('logoutBtn').classList.remove('hidden');

  const superAdmin=role==='admin';
  const perms=superAdmin?ADMIN_PERMS:((user&&user.permissions)||[]);
  const showTrials=perms.includes('intake_admin');
  const showLeadManagement=perms.includes('table_event_admin')||perms.includes('partner_pages')||perms.includes('leads');
  const showAdministration=superAdmin;
  $('trialsSection').classList.toggle('hidden',!showTrials);
  $('leadManagementSection').classList.toggle('hidden',!showLeadManagement);
  $('administrationSection').classList.toggle('hidden',!showAdministration);
  $('adminIntakeBtn').classList.toggle('hidden',!perms.includes('intake_admin'));
  $('adminTableEventsTile').classList.toggle('hidden',!perms.includes('table_event_admin'));
  $('partnerPagesTile').classList.toggle('hidden',!perms.includes('partner_pages'));
  $('leadsTile').classList.toggle('hidden',!perms.includes('leads'));
  $('accessTile').classList.toggle('hidden',!superAdmin);

  $('adminWho').textContent=superAdmin?'Super Admin':`Signed in as ${user?.display_name||'User'}`;
  cacheIdentity(role,user);
  if(/^\d{4}$/.test(rawCode)&&superAdmin){
    sessionStorage.setItem('table_admin_code',rawCode);
    sessionStorage.setItem('landingAdminPin',rawCode);
  }
}
async function submitPin(){
  const code=$('pin').value.trim();$('pinMsg').textContent='';
  if(!/^\d{4}$/.test(code)){$('pinMsg').textContent='Enter exactly 4 digits.';return}
  const {r,j}=await auth(code);
  if(!r.ok||!j.ok){$('pinMsg').textContent=j.message||'That PIN is not valid.';return}
  if(mode==='event'){
    if(j.role!=='event'){$('pinMsg').textContent='That is not a Table Event code.';return}
    sessionStorage.setItem('table_access_code',code);sessionStorage.setItem('table_event_code',code);location.href='/admin/event/';return;
  }
  if(j.role==='admin'||j.role==='user'){closePin();showDashboard(j.role,j.user,code);return}
  $('pinMsg').textContent='Use the Table Events button for an event code.';
}
async function restore(){
  const cached=cachedIdentity();
  if(cached)showDashboard(cached.role,cached.user);
  try{
    const r=await fetch('/api/leads/auth',{cache:'no-store'}),j=await r.json().catch(()=>({}));
    if(r.ok&&j.ok&&(j.role==='admin'||j.role==='user')){showDashboard(j.role,j.user);return}
  }catch{}
  showStaff();
}
$('adminBtn').onclick=()=>openPin('admin');$('staffTableEventsBtn').onclick=()=>openPin('event');$('adminIntakeBtn').onclick=launchIntakeAdmin;$('pinCancel').onclick=closePin;$('pinGo').onclick=submitPin;$('pin').addEventListener('keydown',e=>{if(e.key==='Enter')submitPin()});$('pinBack').addEventListener('click',e=>{if(e.target===$('pinBack'))closePin()});
$('logoutBtn').onclick=async()=>{clearIdentity();try{await fetch('/api/leads/auth',{method:'DELETE',cache:'no-store'})}catch{}sessionStorage.removeItem('table_access_code');sessionStorage.removeItem('table_admin_code');sessionStorage.removeItem('table_event_code');sessionStorage.removeItem('landingAdminPin');showStaff()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('/staff/sw.js',{scope:'/staff/'}).catch(()=>{});
restore();
})();
</script>
</body>
</html>
