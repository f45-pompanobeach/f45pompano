<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1C1C2E"><title>Leads · F45 Pompano</title>
<style>
:root{--navy:#1C1C2E;--red:#E8272A;--yellow:#FFB800;--muted:#6b7280}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Arial,sans-serif;background:#f4f5f7;color:#20202b}body{padding:calc(14px + env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom));overflow-x:hidden}.top{position:sticky;top:0;z-index:20;background:rgba(244,245,247,.95);backdrop-filter:blur(10px);padding:8px 0 12px}.topin{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.back{border:0;border-radius:10px;background:var(--navy);color:#fff;text-decoration:none;padding:11px 14px;font-weight:900}.title{font-size:26px;font-weight:950;color:var(--navy)}.page{max-width:980px;margin:auto}.filters{background:#fff;border-radius:16px;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.07);display:grid;grid-template-columns:1fr 160px 160px;gap:10px;margin-bottom:14px}.filters input,.filters select{width:100%;font-size:15px;padding:12px;border:1.5px solid #cbd0d9;border-radius:9px;background:#fff}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.pill{background:#fff;border:1px solid #e2e4e9;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:900}.list{display:grid;gap:10px}.lead{background:#fff;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.07);display:grid;grid-template-columns:1fr auto;gap:12px}.lead h3{margin:0 0 5px;font-size:18px;color:var(--navy)}.meta{font-size:12px;color:var(--muted);line-height:1.5}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.tag{font-size:10px;font-weight:900;text-transform:uppercase;border-radius:999px;padding:5px 8px;background:#eef0f4}.tag.source{background:#fff4cc;color:#6a4b00}.tag.tracked{background:#e7f7eb;color:#176c34}.actions{display:flex;align-items:center}.track{border:0;border-radius:9px;padding:10px 12px;background:var(--navy);color:#fff;font-weight:900;font-size:12px;cursor:pointer;white-space:nowrap}.track.on{background:#e5e7eb;color:#333}.empty{text-align:center;padding:50px 20px;color:var(--muted)}@media(max-width:680px){.filters{grid-template-columns:1fr}.lead{grid-template-columns:1fr}.actions{justify-content:stretch}.track{width:100%}}
</style></head><body>
<header class="top"><div class="topin"><a class="back" href="/leads-trials/">← Admin</a><div class="title">Leads</div><span></span></div></header>
<main class="page">
<section class="filters"><input id="search" type="search" placeholder="Search name, phone, email, ZIP"><select id="source"><option value="all">All sources</option><option value="event">Table Events</option><option value="partner">Partner Pages</option><option value="website">Website</option><option value="general">General Leads</option></select><select id="tracking"><option value="all">All Leads</option><option value="open">Needs Follow-Up</option><option value="tracked">Handled</option></select></section>
<div class="stats"><span id="total" class="pill">0 leads</span><span id="openCount" class="pill">0 needs follow-up</span><span id="trackedCount" class="pill">0 handled</span></div>
<div id="list" class="list"></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id);let leads=[],code=sessionStorage.getItem('table_admin_code')||sessionStorage.getItem('table_access_code')||'';
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function sourceType(l){if(l.event_type==='partner-page'||String(l.event_key||'').startsWith('landing:'))return'partner';if(l.event_type==='website'||String(l.event_key||'').startsWith('website:'))return'website';if(l.event_key==='general')return'general';return'event'}
function sourceLabel(l){const t=sourceType(l);if(t==='partner')return 'Partner Page';if(t==='website')return 'Website';if(t==='general')return 'General Lead';return 'Table Event'}
function fmt(v){try{return new Date(v).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'})}catch{return v||''}}
async function api(url,opt={}){opt.headers={...(opt.headers||{})};if(/^\d{4}$/.test(code))opt.headers['x-table-code']=code;const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(r.status===401){location.replace('/leads-trials/');throw new Error('unauthorized')}if(!r.ok||!j.ok)throw new Error(j.message||j.error||'Request failed');return j}
function filtered(){const q=$('search').value.trim().toLowerCase(),src=$('source').value,tr=$('tracking').value;return leads.filter(l=>{if(src!=='all'&&sourceType(l)!==src)return false;if(tr==='tracked'&&!Number(l.tracked_elsewhere))return false;if(tr==='open'&&Number(l.tracked_elsewhere))return false;if(q){const hay=[l.first_name,l.last_name,l.email,l.phone,l.zip,l.event_name,l.lead_source].join(' ').toLowerCase();if(!hay.includes(q))return false}return true})}
function render(){const shown=filtered(),tracked=leads.filter(x=>Number(x.tracked_elsewhere)).length;$('total').textContent=leads.length+' leads';$('trackedCount').textContent=tracked+' tracked elsewhere';$('openCount').textContent=(leads.length-tracked)+' not tracked elsewhere';$('list').innerHTML=shown.map(l=>`<article class="lead"><div><h3>${esc(l.first_name)} ${esc(l.last_name)}</h3><div class="meta">${esc(l.email)} · ${esc(l.phone)} · ZIP ${esc(l.zip)}<br>${esc(l.event_name||l.lead_source||'Lead')} · ${esc(fmt(l.created_at))}</div><div class="tags"><span class="tag source">${sourceLabel(l)}</span>${Number(l.tracked_elsewhere)?'<span class="tag tracked">Handled</span>':''}</div></div><div class="actions"><button class="track ${Number(l.tracked_elsewhere)?'on':''}" data-id="${esc(l.id)}" data-state="${Number(l.tracked_elsewhere)?'1':'0'}">${Number(l.tracked_elsewhere)?'Mark as Needs Follow-Up':'Mark as Handled'}</button></div></article>`).join('')||'<div class="empty">No leads match these filters.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>toggle(b.dataset.id,b.dataset.state!=='1'))}
async function toggle(id,on){const b=document.querySelector('[data-id="'+CSS.escape(id)+'"]');if(b)b.disabled=true;try{const j=await api('/api/leads/admin/tracked',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,tracked:on})});const l=leads.find(x=>x.id===id);if(l){l.tracked_elsewhere=j.tracked_elsewhere?1:0;l.tracked_elsewhere_at=j.tracked_elsewhere_at||null}render()}catch(e){alert(e.message)}finally{if(b)b.disabled=false}}
async function load(){try{const j=await api('/api/leads/admin/all');leads=j.leads||[];render()}catch{}}
['search','source','tracking'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
(async()=>{if(!/^\d{4}$/.test(code)){try{const r=await fetch('/api/leads/auth',{cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok||j.role!=='admin'){location.replace('/leads-trials/');return}}catch{location.replace('/leads-trials/');return}}load()})();
})();
</script></body></html>
