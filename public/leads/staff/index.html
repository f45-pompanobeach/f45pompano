<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1C1C2E"><title>Table Leads Login</title><link rel="icon" href="/leads/table-leads-icon.svg" type="image/svg+xml"><style>
:root{--red:#E8272A;--navy:#1C1C2E;--bg:#EDF0F8;--line:#D9DEE8;--muted:#6B7280;--green:#16833B}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:#111}.wrap{max-width:850px;margin:auto;padding:10px 10px 80px}.panel{background:#fff;border-radius:16px;box-shadow:0 12px 34px rgba(28,28,46,.12);overflow:hidden}.login{max-width:470px;margin:10vh auto 0;padding:26px}.login h1{margin:0;color:var(--navy)}.login p{font-size:13px;color:var(--muted);line-height:1.5}.code{width:100%;font-size:28px;text-align:center;letter-spacing:12px;padding:13px;border:2px solid #B8C0CC;border-radius:9px}.btn{border:0;border-radius:8px;padding:12px 14px;font-weight:900;cursor:pointer}.primary{width:100%;margin-top:12px;background:var(--red);color:#fff}.head{background:var(--navy);color:#fff;padding:17px}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px}.head h1{font-size:21px;margin:0}.head p{margin:5px 0 0;color:#d7dbe5;font-size:12px}.live{font-size:11px;font-weight:900}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#9CA3AF;margin-right:5px}.dot.on{background:#39D071}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:11px;border-bottom:1px solid var(--line)}.tool{background:#F3F4F6;color:#374151}.logout{margin-left:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}.stat{background:#F7F8FB;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}.stat b{display:block;color:var(--navy);font-size:20px}.stat span{font-size:9px;font-weight:900;color:var(--muted);text-transform:uppercase}.list{padding:0 12px 12px}.leadrow{width:100%;display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:9px;align-items:center;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;margin:8px 0;cursor:pointer}.check{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#EEF0F4;color:#7B8492;font-weight:900}.check.yes{background:#E8F8EE;color:var(--green);border:2px solid #5FCC80}.who{min-width:0}.who b{display:block;font-size:14px;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who small{display:block;margin-top:3px;color:var(--muted);font-size:11px}.notepreview{display:block;margin-top:4px;color:#374151;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tags{display:flex;justify-content:flex-end;gap:5px;flex-wrap:wrap;max-width:240px}.tag{border-radius:999px;padding:5px 7px;font-size:9px;font-weight:900;background:#F3F4F6;color:#4B5563}.tag.bad{background:#FFF0F0;color:#B91C1C;border:1px solid #F0A6A6}.tag.prize{background:#FFF8D8;color:#765A00;border:1px solid #F0D54F}.tag.ok{background:#E8F8EE;color:#16833B}.empty{text-align:center;color:var(--muted);padding:34px 10px}.sheetback{display:none;position:fixed;inset:0;background:rgba(12,14,25,.55);z-index:20;padding:18px;align-items:flex-end;justify-content:center}.sheetback.show{display:flex}.sheet{background:#fff;width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:18px;padding:18px}.sheethead{display:flex;justify-content:space-between;gap:10px}.sheet h2{margin:0;color:var(--navy)}.close{border:0;background:#F3F4F6;width:36px;height:36px;border-radius:50%;font-size:20px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}.detail{background:#F7F8FB;border:1px solid var(--line);border-radius:9px;padding:10px}.detail span{display:block;font-size:9px;color:var(--muted);font-weight:900;text-transform:uppercase}.detail b{display:block;margin-top:4px;font-size:12px;overflow-wrap:anywhere}.sectiontitle{margin:18px 0 8px;font-size:11px;font-weight:900;letter-spacing:1px;color:var(--navy);text-transform:uppercase}.notes{width:100%;min-height:92px;border:2px solid #B8C0CC;border-radius:9px;padding:11px;font:500 16px/1.4 inherit}.notesave,.saveprize{margin-top:8px;background:var(--red);color:#fff;width:100%}.prizes{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prizebtn{border:2px solid var(--line);background:#fff;border-radius:10px;padding:11px 8px;font-size:12px;font-weight:800;cursor:pointer}.prizebtn.selected{border-color:var(--red);background:#FFF3F3;color:#9F1618}.custombox{display:none;margin-top:9px}.custombox.show{display:block}.custombox input{width:100%;border:2px solid #B8C0CC;border-radius:8px;padding:11px;font-size:16px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 14px;border-radius:9px;font-size:12px;font-weight:800;z-index:40;display:none}.toast.show{display:block}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}.leadrow{grid-template-columns:38px minmax(0,1fr)}.tags{grid-column:2;justify-content:flex-start;max-width:none}.detailgrid,.prizes{grid-template-columns:1fr}.sheetback{padding:0}.sheet{border-radius:18px 18px 0 0}.logout{margin-left:0}}
</style></head><body><main class="wrap"><section id="login" class="panel login"><h1>Table Leads Login</h1><p>Enter your 4-digit access code. Super Admin codes open the Admin Portal; event codes open only that event's leads.</p><input id="loginCode" class="code" type="password" inputmode="numeric" maxlength="4" autocomplete="one-time-code"><button id="loginBtn" class="btn primary">Continue</button><p id="loginErr" style="color:#991B1B;font-weight:800"></p></section><section id="app" class="panel" hidden><div class="head"><div class="headrow"><div><h1 id="eventName">Table Leads</h1><p id="eventMeta"></p></div><div class="live"><span id="dot" class="dot"></span><span id="liveText">CONNECTING</span></div></div></div><div class="toolbar"><button id="entry" class="btn tool">Entry Form</button><button id="refresh" class="btn tool">Refresh</button><button id="export" class="btn tool">Export CSV</button><button id="logout" class="btn tool logout">Log Out</button></div><div class="stats"><div class="stat"><b id="total">0</b><span>Total Leads</span></div><div class="stat"><b id="confirmed">0</b><span>Confirmed</span></div><div class="stat"><b id="nonlocal">0</b><span>Non-Local</span></div><div class="stat"><b id="marketing">0</b><span>Marketing Opt-In</span></div></div><div id="list" class="list"></div></section></main><div id="sheetback" class="sheetback"><section class="sheet"><div class="sheethead"><div><h2 id="dname"></h2><div id="dsub" style="margin-top:4px;color:#6B7280;font-size:12px"></div></div><button id="close" class="close">×</button></div><div id="details" class="detailgrid"></div><div class="sectiontitle">Comments / Notes</div><textarea id="notes" class="notes" maxlength="1000"></textarea><button id="saveNotes" class="btn notesave">Save Notes</button><div id="prizeSection" hidden><div class="sectiontitle">Prize</div><div id="prizes" class="prizes"></div><div id="custombox" class="custombox"><input id="customPrize" maxlength="60" placeholder="Write-in prize"></div><button id="savePrize" class="btn saveprize">Save Prize</button></div></section></div><div id="toast" class="toast"></div><script>
(()=>{const $=id=>document.getElementById(id);let code=sessionStorage.getItem('table_access_code')||'',event=null,leads=[],current=null,selected='__NONE__';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=t=>t?new Date(t).toLocaleString([],{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'—';const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)};function hdr(){return {'x-table-code':code}}async function api(url,opt={}){opt.headers={...(opt.headers||{}),...hdr()};const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(r.status===401){logout();throw new Error('Access code no longer valid.')}if(!r.ok||!j.ok)throw new Error(j.message||j.error||'Request failed');return j}function setLive(v){$('dot').classList.toggle('on',v);$('liveText').textContent=v?'LIVE':'OFFLINE'}function showApp(){$('login').hidden=true;$('app').hidden=false}function logout(){sessionStorage.removeItem('table_access_code');sessionStorage.removeItem('table_admin_code');sessionStorage.removeItem('table_event_code');code='';location.reload()}async function login(){const c=$('loginCode').value.trim();if(!/^\d{4}$/.test(c)){$('loginErr').textContent='Enter exactly 4 digits.';return}const r=await fetch('/api/leads/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:c})}),j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){$('loginErr').textContent='Invalid access code.';return}sessionStorage.setItem('table_access_code',c);code=c;if(j.role==='admin'){sessionStorage.setItem('table_admin_code',c);location.href='/leads/admin/';return}sessionStorage.setItem('table_event_code',c);showApp();await load()}async function load(){try{const j=await api('/api/leads/staff/leads');event=j.event;leads=j.leads||[];$('eventName').textContent=event.name;$('eventMeta').textContent=`${event.event_date} · ${event.start_time}–${event.end_time}${event.qr_kit?' · QR Kit '+event.qr_kit:''}`;render();setLive(true)}catch(e){setLive(false);toast(e.message)}}function render(){$('total').textContent=leads.length;$('confirmed').textContent=leads.filter(x=>x.confirmed_at).length;$('nonlocal').textContent=leads.filter(x=>!Number(x.is_local)).length;$('marketing').textContent=leads.filter(x=>Number(x.marketing_opt_in)).length;$('list').innerHTML=leads.map(l=>{const np=String(l.notes||'').trim().replace(/\s+/g,' ');return `<button class="leadrow" data-id="${l.id}"><span class="check ${l.confirmed_at?'yes':''}">${l.confirmed_at?'✓':'•'}</span><span class="who"><b>${esc(l.first_name)} ${esc(l.last_name)}</b><small>${fmt(l.created_at)}</small>${np?`<span class="notepreview">📝 ${esc(np)}</span>`:''}</span><span class="tags">${l.confirmed_at?'<span class="tag ok">CONFIRMED</span>':''}${!Number(l.is_local)?'<span class="tag bad">NON-LOCAL</span>':''}${l.prize?`<span class="tag prize">${esc(l.prize)}</span>`:''}</span></button>`}).join('')||'<div class="empty">No leads yet for this event.</div>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openLead(b.dataset.id))}function eventPrizeList(){try{return JSON.parse(event?.prizes_json||'[]')||[]}catch{return []}}function openLead(id){current=leads.find(x=>x.id===id);if(!current)return;$('dname').textContent=`${current.first_name} ${current.last_name}`;$('dsub').textContent=current.confirmed_at?`Confirmed ${fmt(current.confirmed_at)}`:'Not confirmed';$('details').innerHTML=`<div class="detail"><span>Phone</span><b>${esc(current.phone)}</b></div><div class="detail"><span>Email</span><b>${esc(current.email)}</b></div><div class="detail"><span>ZIP</span><b>${esc(current.zip)} ${Number(current.is_local)?'· LOCAL':'· NON-LOCAL'}</b></div><div class="detail"><span>Marketing SMS</span><b>${Number(current.marketing_opt_in)?'Yes':'No'}</b></div>`;$('notes').value=current.notes||'';renderPrizes();$('sheetback').classList.add('show')}function renderPrizes(){const on=event&&Number(event.prize_enabled);$('prizeSection').hidden=!on;if(!on)return;const opts=eventPrizeList();selected=current?.prize||'__NONE__';$('prizes').innerHTML=[`<button class="prizebtn ${selected==='__NONE__'?'selected':''}" data-p="__NONE__">No Prize / Reset</button>`,...opts.map(p=>`<button class="prizebtn ${selected===p?'selected':''}" data-p="${esc(p)}">${esc(p)}</button>`),`<button class="prizebtn ${selected==='__CUSTOM__'?'selected':''}" data-p="__CUSTOM__">Write-In Prize</button>`].join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{selected=b.dataset.p;$('custombox').classList.toggle('show',selected==='__CUSTOM__');document.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('selected',x===b))});$('custombox').classList.remove('show');$('customPrize').value=''}async function saveNotes(){if(!current)return;try{const n=$('notes').value;await api('/api/leads/staff/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:current.id,notes:n})});current.notes=n;render();toast('Notes saved.')}catch(e){toast(e.message)}}async function savePrize(){if(!current)return;let prize=selected,custom=false;if(selected==='__NONE__')prize=null;if(selected==='__CUSTOM__'){prize=$('customPrize').value.trim();custom=true;if(prize.length<2){toast('Enter a write-in prize.');return}}try{const j=await api('/api/leads/staff/prize',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id:current.id,prize,custom})});current.prize=j.prize||null;render();$('sheetback').classList.remove('show');toast(j.prize_text_status&&j.prize_text_status!=='not_sent'?`Prize saved · text ${j.prize_text_status}`:'Prize saved.')}catch(e){toast(e.message)}}function exportCsv(){if(!event)return;const rows=[['First Name','Last Name','Email','Phone','ZIP','Local','Confirmed','Prize','Marketing Opt-In','Created','Notes'],...leads.map(l=>[l.first_name,l.last_name,l.email,l.phone,l.zip,Number(l.is_local)?'Yes':'No',l.confirmed_at||'',l.prize||'',Number(l.marketing_opt_in)?'Yes':'No',l.created_at,l.notes||''])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${event.slug}-leads.csv`;a.click();URL.revokeObjectURL(a.href)}$('loginBtn').onclick=login;$('loginCode').onkeydown=e=>{if(e.key==='Enter')login()};$('refresh').onclick=load;$('entry').onclick=()=>event&&window.open(`/leads/?event=${encodeURIComponent(event.slug)}`,'_blank');$('export').onclick=exportCsv;$('logout').onclick=logout;$('close').onclick=()=>$('sheetback').classList.remove('show');$('sheetback').onclick=e=>{if(e.target===$('sheetback'))$('sheetback').classList.remove('show')};$('saveNotes').onclick=saveNotes;$('savePrize').onclick=savePrize;if(code){fetch('/api/leads/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})}).then(r=>r.json()).then(j=>{if(j.ok&&j.role==='admin'){location.href='/leads/admin/'}else if(j.ok&&j.role==='event'){showApp();load()}else logout()}).catch(logout)}setInterval(()=>{if(code&&event)load()},15000)})();
</script></body></html>
