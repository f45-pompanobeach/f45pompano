<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#1C1C2E"><title>Table Leads — Event Staff</title><link rel="icon" href="/leads/table-leads-icon.svg" type="image/svg+xml"><style>:root{--red:#e8272a;--navy:#1c1c2e;--bg:#edf0f8;--line:#d9dee7;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,Arial,sans-serif;color:#111}.top{background:var(--navy);color:#fff;padding:16px}.topin{width:min(900px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900}.brand small{display:block;color:#ffcc00;font-size:10px;letter-spacing:1.4px;margin-bottom:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:7px;padding:11px 13px;font:inherit;font-size:12px;font-weight:900;cursor:pointer;background:#fff;color:var(--navy)}.btn.red{background:var(--red);color:#fff}.btn.gray{background:#eef0f4;color:#374151}.page{width:min(900px,100%);margin:auto;padding:18px 12px 50px}.login{width:min(440px,100%);margin:70px auto;background:#fff;border-top:6px solid var(--red);border-radius:14px;padding:24px;box-shadow:0 15px 40px rgba(28,28,46,.14)}.login h1{margin:0 0 7px;color:var(--navy)}.login p{font-size:13px;color:var(--muted);line-height:1.5}.code{width:100%;font-size:28px;text-align:center;letter-spacing:12px;padding:13px;border:2px solid #b8c0cc;border-radius:8px}.section{background:#fff;border-radius:14px;padding:18px;margin-bottom:15px;box-shadow:0 8px 28px rgba(28,28,46,.08)}.eventtitle h1{margin:0 0 5px;color:var(--navy);font-size:26px}.meta{font-size:12px;color:#667085;line-height:1.6}.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#fff4cc;color:#7a5100;font-size:10px;font-weight:900;margin-top:7px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#f6f7fa;border-radius:9px;padding:12px;text-align:center}.stat b{display:block;font-size:23px;color:var(--navy)}.stat span{font-size:9px;font-weight:900;text-transform:uppercase;color:#667085}.lead{border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;background:#fff}.lead summary{cursor:pointer;font-weight:900;color:var(--navy)}.d{font-size:12px;color:#475467;line-height:1.65;margin-top:9px}.lead textarea{width:100%;min-height:80px;border:2px solid #c5cbd5;border-radius:7px;padding:10px;font:inherit;margin-top:9px}.notesave{width:100%;margin-top:7px;background:var(--red);color:#fff}.empty{text-align:center;color:#667085;padding:28px}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111827;color:#fff;padding:11px 15px;border-radius:8px;font-size:12px;font-weight:800;display:none}.toast.show{display:block}.hidden{display:none!important}@media(max-width:650px){.topin{flex-direction:column;align-items:flex-start}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header class="top"><div class="topin"><div class="brand"><small>F45 POMPANO BEACH</small>TABLE LEADS — EVENT STAFF</div><div class="actions" id="topActions" style="display:none"><button class="btn" id="formBtn">Open Entry Form</button><button class="btn" id="refreshBtn">Refresh</button><button class="btn" id="exportBtn">Export CSV</button><button class="btn" id="logoutBtn">Log Out</button></div></div></header><main class="page"><section class="login" id="login"><h1>Event Staff</h1><p>Enter the 4-digit code for the event you are working. This portal only shows leads for that event.</p><input class="code" id="loginCode" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="one-time-code"><button class="btn red" id="loginBtn" style="width:100%;margin-top:12px">Open Event</button><p id="loginErr" style="color:#991b1b;font-weight:800"></p></section><div id="app" class="hidden"><section class="section eventtitle"><h1 id="eventName"></h1><div class="meta" id="eventMeta"></div><span class="pill" id="kitPill" style="display:none"></span></section><section class="section"><div class="stats" id="stats"></div></section><section class="section"><div id="leadList"></div></section></div></main><div class="toast" id="toast"></div><script>(()=>{let code=sessionStorage.getItem('table_event_code')||'',event=null,leads=[];const $=id=>document.getElementById(id),toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function api(url,opt={}){opt.headers={...(opt.headers||{}),'x-table-code':code};const r=await fetch(url,opt),j=await r.json().catch(()=>({}));if(r.status===401){sessionStorage.removeItem('table_event_code');code='';showLogin();throw new Error('Event code is no longer valid.')}if(!r.ok||!j.ok)throw new Error(j.message||j.error||'Request failed');return j}function showLogin(){$('login').style.display='block';$('app').classList.add('hidden');$('topActions').style.display='none'}function showApp(){$('login').style.display='none';$('app').classList.remove('hidden');$('topActions').style.display='flex'}async function login(){const c=$('loginCode').value.trim();if(!/^\d{4}$/.test(c)){$('loginErr').textContent='Enter 4 digits.';return}const r=await fetch('/api/leads/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:c})}),j=await r.json().catch(()=>({}));if(j.ok&&j.role==='admin'){sessionStorage.setItem('table_admin_code',c);location.href='/leads/admin/';return}if(!r.ok||j.role!=='event'){$('loginErr').textContent='Invalid event code.';return}code=c;sessionStorage.setItem('table_event_code',code);showApp();await load()}async function load(){try{const j=await api('/api/leads/staff/leads');event=j.event;leads=j.leads||[];$('eventName').textContent=event.name;$('eventMeta').textContent=`${event.event_date} · ${event.start_time}–${event.end_time}`;if(event.qr_kit){$('kitPill').style.display='inline-block';$('kitPill').textContent=`QR Kit ${event.qr_kit}`}else $('kitPill').style.display='none';render()}catch(e){toast(e.message)}}function render(){const total=leads.length,local=leads.filter(x=>Number(x.is_local)).length,mkt=leads.filter(x=>Number(x.marketing_opt_in)).length,notes=leads.filter(x=>String(x.notes||'').trim()).length;$('stats').innerHTML=[[total,'Total'],[local,'Local'],[mkt,'Marketing Opt-In'],[notes,'With Notes']].map(x=>`<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');$('leadList').innerHTML=leads.map(l=>`<details class="lead"><summary>${esc(l.first_name)} ${esc(l.last_name)} ${Number(l.is_local)?'· LOCAL':''}</summary><div class="d">${esc(l.email)}<br>${esc(l.phone)} · ZIP ${esc(l.zip)}<br>Submitted ${esc(new Date(l.created_at).toLocaleString())}<br>Marketing SMS: ${Number(l.marketing_opt_in)?'Yes':'No'}${l.prize?`<br>Prize: ${esc(l.prize)}`:''}</div><textarea maxlength="1000" id="n_${l.id}" placeholder="Private staff notes...">${esc(l.notes||'')}</textarea><button class="btn notesave" data-save="${l.id}">Save Notes</button></details>`).join('')||'<div class="empty">No leads yet for this event.</div>';document.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>saveNote(b.dataset.save))}async function saveNote(id){try{const n=$(`n_${id}`).value;await api('/api/leads/staff/notes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,notes:n})});const l=leads.find(x=>x.id===id);if(l)l.notes=n;toast('Notes saved.')}catch(e){toast(e.message)}}function exportCsv(){if(!event)return;const rows=[['First Name','Last Name','Email','Phone','ZIP','Local','Marketing Opt-In','Created','Notes'],...leads.map(l=>[l.first_name,l.last_name,l.email,l.phone,l.zip,Number(l.is_local)?'Yes':'No',Number(l.marketing_opt_in)?'Yes':'No',l.created_at,l.notes||''])];const csv=rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`${event.slug}-leads.csv`;a.click();URL.revokeObjectURL(a.href)}$('loginBtn').onclick=login;$('loginCode').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('refreshBtn').onclick=load;$('formBtn').onclick=()=>{if(event)window.open(`/leads/?event=${encodeURIComponent(event.slug)}`,'_blank')};$('exportBtn').onclick=exportCsv;$('logoutBtn').onclick=()=>{sessionStorage.removeItem('table_event_code');code='';location.reload()};if(code){fetch('/api/leads/auth',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code})}).then(r=>r.json()).then(j=>{if(j.ok&&j.role==='event'){showApp();load()}else showLogin()}).catch(showLogin)}else showLogin();setInterval(()=>{if(code&&event)load()},15000)})();</script></body></html>
